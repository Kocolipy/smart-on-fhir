# Prometheus alerting rules for the provisioning surface.
#
# Four alerts, each a condition that means an integration is broken or hostile
# rather than merely busy; infra/README.md's "Alerts" table says what each means
# and what to do about it. A second
# group holds recording rules: series an operator reads on a dashboard, which
# describe how an integration behaves but are not a fault to page on. Load this file
# with `rule_files:` in the Prometheus that scrapes /actuator/prometheus; the
# scrape itself, and who may read it, is in infra/README.md.
#
# Every selector here is checked against a real scrape by
# OperationalTelemetryIntegrationTests, so a metric or tag renamed in code turns
# the build red instead of leaving a rule that silently matches nothing.
#
# Thresholds are starting points in requests per second, sustained for the `for:`
# window. They are deployment-specific — a directory with thousands of users
# reconciles far harder than one with fifty — so tune them against a week of
# normal traffic rather than reading them as a standard.
groups:
  - name: provisioning-surface
    rules:
      # 1. Sustained authentication failures: dead or probing credentials.
      - alert: ScimAuthenticationFailuresSustained
        expr: >
          sum by (scim_resource_type) (
            rate(http_server_requests_seconds_count{status="401", scim_resource_type!="none"}[5m])
          ) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: SCIM requests are being refused for their credential
          description: >
            A sustained rate of 401s on the SCIM namespace. Either a connector's token
            expired or was revoked and the connector has not been given its
            replacement, or something is presenting tokens it does not hold.
          runbook: >
            List the connectors (GET /api/admin/connectors) and look for a token past
            its expiry or revoked, then issue or rotate one. Which connector is
            affected is not in this metric: a refused token authenticated no one. If
            every connector's token is current, treat it as probing and take the
            source addresses from the edge (load balancer) access log.
      - alert: LoginAuthenticationFailuresSustained
        expr: >
          sum(rate(http_server_requests_seconds_count{uri="/api/auth/login", status="401"}[5m])) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Password logins are failing at a sustained rate
          description: >
            A sustained rate of rejected logins. Lockout stops any one account being
            guessed past its limit, so this is the signal for a campaign spread across
            many accounts — which lockout alone never sees.
          runbook: >
            Read the audit trail's LOGIN_FAILURE events for which accounts are
            targeted, and the edge (load balancer) access log for where the attempts
            come from. Locked accounts stay locked until an Admin unlocks them.

      # 2. Precondition failures: writers colliding (412). If-Match is optional, so a
      #    write that sends none is never refused for it — see the recording rule
      #    scim:unconditional_writes:rate1h below for which connectors write that way.
      - alert: ScimPreconditionFailuresSustained
        expr: >
          sum(rate(http_server_requests_seconds_count{status="412", scim_resource_type!="none"}[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: SCIM writes are failing their precondition
          description: >
            A sustained rate of 412s: two writers are updating the same resources with
            If-Match, and one keeps losing to the other.
          runbook: >
            Find the second writer (another connector, or an Admin editing the same
            Users) from the audit trail's actor on the conflicting resources.

      # 3. Uniqueness conflicts: a connector re-creating identities it believes are
      #    missing.
      - alert: ScimUniquenessConflictsSustained
        expr: >
          sum(rate(http_server_requests_seconds_count{status="409", scim_resource_type!="none"}[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: SCIM creates are colliding with existing identities
          description: >
            A sustained rate of 409 uniqueness refusals: a connector is POSTing Users or
            Groups that already exist, usually because it lost its own mapping of
            externalId to resource id and is re-provisioning from scratch.
          runbook: >
            Compare the connector's provisioning log with the directory. Re-linking is
            the connector's job (find by filter, then PUT); deleting the existing
            identities to let the creates succeed destroys their history and ids.

      # 4. The dormancy job failing to run. DormancyScheduleConfig names it to the
      #    scheduled-job module (ScheduledJobMetrics) as job="dormancy", so both series exist —
      #    at zero, and at the scheduling time — from startup.
      - alert: DormancyJobFailed
        expr: >
          increase(app_job_runs_total{job="dormancy", outcome="failure"}[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: The dormancy job threw
          description: >
            A run of the job that locks dormant Users and revokes the Roles of long-dormant
            ones failed. Accounts that should have been locked can still sign in.
          runbook: >
            Read the scheduler's ERROR record in the structured log for the failure's
            type and stack, fix the cause, and confirm the next scheduled run
            increments outcome="success".
      - alert: DormancyJobNotRunning
        expr: >
          time() - app_job_last_success_seconds{job="dormancy"} > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: The dormancy job has not succeeded in over a day
          description: >
            The daily job has gone 26 hours without a successful run — its schedule is
            not firing, or every run fails. Dormant accounts are not being locked.
          runbook: >
            Check DormancyJobFailed first. If it is silent the trigger is not firing:
            confirm the instance is up and was not restarted into a configuration that
            no longer schedules the job.

  - name: epic-login
    rules:
      # Epic's id_token signing keys unreachable. The JWKS is fetched only when an
      # id_token names a key the kept JWKS lacks, so an error here is a clinician's
      # launch landing at the unavailable notice; errors in every 5-minute window for 5
      # minutes running mean Epic's keys are not coming back on their own. The series
      # exist at zero from startup while Epic Login is on (EpicOutboundInterceptor).
      - alert: EpicJwksFetchFailing
        expr: >
          sum(increase(epic_outbound_errors_total{call="jwks"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Epic's JWKS cannot be fetched, so Epic Login is unavailable
          description: >
            Fetches of Epic's id_token signing keys have timed out or been answered 5xx
            for 5 minutes. Each such launch lands at /?signin=unavailable; clinicians
            cannot sign in from Epic, while password Login is unaffected.
          runbook: >
            Read the ERROR records with app.epic.call="jwks" for the category — "Epic
            outbound call failed" when Epic gave no answer (network), "Epic sign-in
            failed" when it answered 5xx (server) — and Epic's jwks_uri host. Check
            outbound connectivity from the instance to that host, then Epic's status page.
            Nothing in this service is retried for it: the next launch fetches again.
      # Epic's token or discovery endpoint unreachable: the same condition as the JWKS
      # rule above for the two calls every launch makes. Discovery is read on the first
      # launch after startup and once a day after; the token call on every launch.
      - alert: EpicEndpointUnavailable
        expr: >
          sum by (call) (increase(epic_outbound_errors_total{call=~"token|discovery"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Epic's token or discovery endpoint is unavailable, so Epic Login is too
          description: >
            Calls to Epic's token or discovery endpoint have timed out or been answered
            5xx for 5 minutes. Each such launch lands at /?signin=unavailable; clinicians
            cannot sign in from Epic, while password Login is unaffected.
          runbook: >
            The call label names the endpoint. Read its ERROR records (app.epic.call)
            for the category: "Epic outbound call failed" (network) carries the host in
            url.full; for "Epic sign-in failed" (server), take it from that call's "Epic
            outbound call completed" record in the same trace. Check outbound connectivity
            from the instance to that host, then Epic's status page. Nothing is retried:
            the next launch calls again.
      # Epic refused our own credential: invalid_client, or our client assertion rejected.
      # This never passes on its own — a signing key or the registration is wrong — so a
      # single one pages, unlike Epic being down. The token call is the only one that
      # presents our credential, so a 401 from discovery or the JWKS is not this.
      - alert: EpicClientCredentialRefused
        expr: >
          sum(increase(epic_login_failed_calls_total{call="token", error_category="cert/auth"}[15m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Epic refused this service's client credential
          description: >
            Epic's token endpoint answered invalid_client or rejected the signed client
            assertion. Every Epic launch is refused until it is fixed; the ERROR record
            carries error.follow_up_action=true.
          runbook: >
            Compare the kid in the startup record (app.epic.client_key_id) with the keys
            Epic holds for the registration, and the JWKS this service publishes at
            /api/auth/epic/jwks.json with what Epic last fetched. A key promoted before
            Epic picked it up, or a client ID that does not match APP_EPIC_CLIENT_ID, is
            the usual cause.
      # Refused Epic Logins well above a clinic's normal rate: a broken integration
      # (a wrong APP_EPIC_FHIR_BASE refuses every launch as ISS_MISMATCH), Practitioner
      # IDs not provisioned, or someone replaying launches. The reason label says which.
      - alert: EpicLoginRefusalsSurge
        expr: >
          sum(rate(epic_login_total{outcome="refused"}[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Epic Logins are being refused at an unusual rate
          description: >
            More than three Epic Logins a minute have been refused for 10 minutes. The
            browser is told only /?signin=refused, so clinicians see a refusal without a
            reason.
          runbook: >
            Break epic_login_total{outcome="refused"} down by reason. ISS_MISMATCH or
            INVALID_LAUNCH across the board points at configuration (APP_EPIC_FHIR_BASE,
            the launch URL Epic holds); UNKNOWN_ACCOUNT at Practitioner IDs the
            directory has not provisioned; INVALID_STATE or INVALID_CODE at replayed or
            stale callbacks. The audit trail's LOGIN_FAILURE rows under method sso name
            the refused User where there was one.

  - name: provisioning-surface-recordings
    rules:
      # Writes applied without lost-update protection, per connector. If-Match is
      # optional (RFC 7644 §3.14), and the mainstream provisioning clients do not send
      # it, so a PUT, PATCH or DELETE without one is applied last-writer-wins. Not an
      # alert — an integration that never sends If-Match is legitimate — but the series
      # that tells an operator which connectors run that way, so a lost update can be
      # traced to the integrations that could have caused it. The connector is named by
      # its non-secret id (GET /api/admin/connectors).
      - record: scim:unconditional_writes:rate1h
        expr: >
          sum by (scim_connector, scim_resource_type, method) (
            rate(http_server_requests_seconds_count{scim_precondition="unconditional", outcome="SUCCESS"}[1h])
          )
