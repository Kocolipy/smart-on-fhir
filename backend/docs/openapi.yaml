openapi: 3.1.0
info:
  title: Backend API
  version: 1.0.0
  description: |
    API contract for the session-authenticated application API and the SCIM v2
    provisioning interface.

    CSRF protection is enabled, using the Synchronizer Token Pattern bound to the
    HTTP session. Every unsafe request (POST, PUT, PATCH, DELETE) must carry the
    session's token in the header `GET /api/auth/csrf` names (`X-CSRF-TOKEN`), or
    the request is rejected with 403 before authentication is considered. The
    token is returned only in that endpoint's body — no response sets a CSRF
    cookie. It lives and dies with the session: login discards the token the
    pre-login session held, and logout or a password change ends the session it
    belonged to, so a client fetches a fresh token after each of them.

    The service serves two separate security chains. The session-authenticated
    application API under `/api` uses the session and CSRF rules above. The SCIM v2
    interface under `/scim/v2` is stateless and authenticated per request by an
    opaque connector bearer token, with no session, no CSRF and no cookie: a
    connector token buys nothing under `/api`, and a session buys nothing under
    `/scim/v2`. The operations under the Connectors tag are how an administrator
    mints and retires the credentials that chain accepts.

    **Authorization is declared per operation.** Every operation's own `security`
    requirement says what a caller needs, and the application enforces exactly
    that (ADR 0010): `security: []` is public — no SCIM operation is;
    `connectorBearer: [<permission>]` names the one Permission a token needs, and
    `connectorBearer: []` a valid token alone; `sessionCookie: []` is
    self-service — any signed-in session with baseline access, no Permission;
    `sessionCookie: [<permission>]` names the one Permission the operation
    requires, from the closed set `user:read`, `user:write`, `group:read`,
    `group:write`, `audit:read`, `connector:read`, `connector:write`,
    `connector:token`, `ops:read`, `counter:read`, `counter:write`. A session's
    Permissions are the baseline `counter:read` and `counter:write`, which every
    active User holds, and those the Roles its Groups confer; `GET /api/auth/me`
    reports them. A caller lacking the declared Permission gets a bodiless
    `403` that never names it (see `PermissionRequired`). The application chain
    denies by default: a route or method this document does not declare is
    refused `403`, and a session never reaches `/scim/v2`. A session confined by
    a required password change reaches only `GET /api/auth/me`,
    `POST /api/auth/change-password` and `DELETE /api/auth/logout`.
    `AuthorizationContractTests` proves every declaration here against the
    running application.

    **The SCIM namespace is behind a release gate that is ON by default.** Setting
    `APP_SCIM_ENABLED=false` closes it, and while it is
    closed every path below `/scim/v2` answers `404` with a SCIM error document —
    discovery included, and ahead of authentication. Every SCIM operation documented
    here therefore also has a `404` that means "not served by this deployment" rather
    than "no such resource"; it is not repeated on each operation.

    **The Epic Login namespace is behind a release gate that is OFF by default.**
    While `APP_EPIC_ENABLED` is unset or `false`, every path below `/api/auth/epic`
    answers `404` with the generic `ApiError` body (`request-refused`), ahead of the
    session, CSRF and authorization checks, so the namespace cannot be probed for
    whether it exists. Its operations are the public JWKS and the three browser
    navigations of an EHR launch — `launch`, `authorize` and `callback` — each of
    which answers with a redirect rather than a body.

    SCIM requests and responses use `application/scim+json`; `application/json` is
    accepted and understood, and a response defaults to `application/scim+json`.
    SCIM errors are documents of their own shape (`ScimError`) and never the
    application chain's error shape.

    **Every SCIM refusal is a `ScimError`, whichever layer makes it** — a handler's,
    or the dispatcher's own for a path nothing serves, a method a path does not
    take, an unacceptable `Accept` or an unreadable body type. The credential
    refusals (`401`, and `403 insufficient_scope`) are the exception: they are a
    status and a `WWW-Authenticate` challenge with no body, by design. The refusals
    that can happen in front of any SCIM operation, or where no operation exists,
    are listed once under `x-namespace-responses` rather than repeated on each
    operation. The namespace's per-request safety bounds — not rate limits, which are
    the deployment edge's — are a 1 MiB request body (`413`), filter text of 8 KiB, 20
    levels of nesting and 100 expressions (`400 invalidFilter`), 100 operations in one
    PatchOp and 200 resources in one page (`400 invalidValue` / a capped `count`).

    **Stored lengths.** Every stored User and Group string has a maximum length,
    given as `maxLength` on its schema property below because RFC 7643 has no such
    schema characteristic (so `/Schemas` does not advertise it): 256 for `userName`,
    `displayName`, `externalId`, every `name` sub-attribute and `emails.value`; 64 for
    `preferredLanguage`, `locale` and `timezone`; 32 for `emails.type`. Lengths are
    Unicode code points, as JSON Schema counts them, and `userName` and a Group's
    `displayName` must also fit after NFKC normalization. A longer value is refused on
    POST, PUT and PATCH before anything is written, with `400 invalidValue` and a
    `detail` of the form `emails.type must be at most 32 characters long.` — the
    attribute and the limit, never the value — and the refusal is audited as
    `INVALID_VALUE`. Only a taken live name is `409 uniqueness`.

    **Forbidden characters.** No stored User or Group string may contain U+0000
    (NUL): JSON can carry it as `\u0000`, but PostgreSQL cannot store it. `userName`
    and `displayName`, of a User and of a Group, additionally refuse every other C0
    control (U+0001 to U+001F, newline and tab included) and DEL (U+007F), because they
    are the names an administrator reads and the logs carry, where a control forges a
    line or rewrites a terminal; every other attribute stores those as sent. Either is
    refused like a length — on POST, PUT and PATCH, before anything is written, with
    `400 invalidValue`, audited as `INVALID_VALUE` — and the `detail` names the
    attribute and the rule, never the value: `externalId must not contain the NUL
    character (U+0000).` or `userName must not contain control characters (U+0000 to
    U+001F, U+007F).` A password is not stored as text and is not subject to this.

    A write the database refuses for any other reason is a fault on this side, not a
    refusal of the request: `500` with a `ScimError` body, no `scimType` and a
    `detail` that names no cause. It is not listed on each operation, because no
    well-formed request is meant to produce it.

    The contract is checked mechanically: `src/test/java/com/example/backend/contract/`
    holds every response its fixtures receive against this document — status,
    documented headers, media type and body schema — and fails for a status this
    document promises that no fixture produced. See `docs/api-contract-check.md`.
x-namespace-responses:
  /scim/v2:
    "401":
      $ref: "#/components/responses/ScimUnauthenticated"
    "403":
      $ref: "#/components/responses/ScimInsufficientPermissions"
    "404":
      $ref: "#/components/responses/ScimNoSuchEndpoint"
    "405":
      $ref: "#/components/responses/ScimMethodNotAllowed"
    "406":
      $ref: "#/components/responses/ScimNotAcceptable"
    "413":
      $ref: "#/components/responses/ScimPayloadTooLarge"
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Authentication
  - name: Session
  - name: Counter
  - name: Administration
  - name: Connectors
  - name: Audit
  - name: SCIM
  - name: Health
paths:
  /api/auth/csrf:
    get:
      tags: [Authentication]
      summary: Get the session's CSRF token
      description: |
        Returns the CSRF token bound to the caller's HTTP session, and the header
        an unsafe request carries it in. Public: a caller with no session gets one
        created, so a login form can obtain the token its submission needs. The
        value is XOR-masked afresh on every call, so it differs between calls while
        every value returned for one session is accepted for it. Never cached.
      operationId: getCsrfToken
      security: []
      responses:
        "200":
          description: The session's token.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                enum: [no-store]
            Set-Cookie:
              description: |
                The session cookie, when the call created the session the token is
                bound to. Never a CSRF cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: |
        Authenticates database-backed credentials, stores the authenticated user
        in the HTTP session, and returns the account and its Permissions. A successful login also
        ends the account's run of failed attempts, resetting its counter to zero.

        One concurrent session per User: a successful login — a login confined
        by a required password change included — ends every other session the
        User holds, once the login commits. The session the request arrived
        with, if any, is the one kept (under a rotated id).
      operationId: login
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          headers:
            Set-Cookie:
              description: |
                The session cookie, under the rotated session id. The CSRF token the
                session held before authentication is discarded rather than carried
                over, so the client fetches a fresh one from `GET /api/auth/csrf`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: |
            The login was refused. One response covers every reason — unknown
            username, wrong password, and an account locked after too many
            consecutive failures — and carries no body, so it cannot be used to
            learn whether an account exists or whether it is locked. Consecutive
            refusals lock the account for a configured window; while it holds, the
            correct password is refused too.
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user
      description: |
        Self-service: needs an authenticated session and no Permission. Also
        answers a session confined by the change-required flag, reporting
        `passwordChangeRequired: true` and no Permission, so a client can route it
        to the change flow.

        `permissions` lists the Permissions the session was issued with, sorted
        by name: the baseline `counter:read` and `counter:write`, which every
        active User holds, and those the role mapping confers through the User's
        direct Group memberships at sign-in. A User in no mapped Group gets the
        baseline two and keeps baseline access. There is no role field: what a User may
        do is its Permissions.
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The authenticated user and its Permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    delete:
      tags: [Authentication]
      summary: Log out
      description: |
        Invalidates the current HTTP session and clears the security context. The
        session's CSRF token ends with it. Logout is not exempt from CSRF: on a
        session that has already expired its token is gone too, so the request is
        refused `403`, and a retry with a freshly fetched token — bound to a new,
        anonymous session — is refused `401`.
      operationId: logout
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Logout completed.
          headers:
            Clear-Site-Data:
              description: |
                Always `"cache","cookies","storage"`, with or without a live
                session, so the browser drops what the signed-out session left
                behind.
              schema:
                type: string
                const: '"cache","cookies","storage"'
            Set-Cookie:
              description: |
                An expired session cookie, so the browser stops sending an id that
                names nothing.
              schema:
                type: string
        "401":
          description: |
            No live session — it expired, was revoked, or never existed. Still a
            browser being signed out, so it carries the same `Clear-Site-Data`.
          headers:
            Clear-Site-Data:
              description: Always `"cache","cookies","storage"`.
              schema:
                type: string
                const: '"cache","cookies","storage"'
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the session's own password
      description: |
        Self-service password change for the User the session belongs to — read
        from the session, never from the request. Open to every authenticated
        session, and one of the three operations (with `GET /api/auth/me` and
        logout) a session confined by the change-required flag may call.

        On success the new password is hashed, the change-required flag is
        cleared, the SCIM version advances, a `PASSWORD_CHANGE` audit event is
        recorded with no password value, and EVERY session of the User is
        revoked — this one included — so the caller logs in again with the new
        password.

        A wrong current password counts toward the same consecutive-failure
        lockout as Login. At the threshold the account locks: Login and further
        change attempts are refused until an Admin calls `unlock`; nothing lifts
        a lockout on its own.
      operationId: changePassword
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed and every session of the User ended.
          headers:
            Set-Cookie:
              description: |
                An expired session cookie. The session's CSRF token ended with it;
                the next login fetches a fresh one.
              schema:
                type: string
        "400":
          description: |
            The body is missing, malformed or fails validation, or the new
            password breaks a policy rule or repeats a recent one. A policy
            refusal carries a `PasswordRuleViolation` body naming the rule; a body
            that is missing, malformed or fails validation carries an `ApiError`
            (`code` `invalid-request`) instead, and has no `rule` or `message`.
            Neither submitted value is ever echoed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PasswordRuleViolation"
                  - $ref: "#/components/schemas/ApiError"
        "401":
          description: |
            No usable session, or the change was refused: wrong current password,
            an account locked out, or an inactive account. One bodiless answer
            covers every reason, as for Login.

            The SESSION tells them apart. A wrong current password below the
            threshold leaves the submitting session standing; the attempt that
            reaches the threshold locks the account and revokes every session of
            the User, the submitting one included, so a `GET /api/auth/me` after
            it answers `401`. The SPA reads a `401` here followed by a `401` from
            `/me` as the lockout.
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/auth/epic/jwks.json:
    get:
      tags: [Authentication]
      summary: Get our public JWKS for Epic
      description: |
        The public keys Epic verifies our `private_key_jwt` client assertions
        against (Epic Login, `/docs/epic-smart-login.md`, D7 and D14): the active
        signing key and, when `APP_EPIC_CLIENT_NEXT_KEY` is configured, the next
        key, in that order. Each is an EC P-384 public key for ES384 signatures,
        under its configured `kid`. Assertions are signed by the active key only;
        the next key is published ahead of its promotion. No private parameter is
        ever present.

        Public: Epic fetches it with no session. While `APP_EPIC_ENABLED` is off
        it answers `404`, as every path under `/api/auth/epic` does, before any
        session, CSRF or authorization check.
      operationId: getEpicJwks
      security: []
      responses:
        "200":
          description: Our public JWKS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwkSet"
        "404":
          description: Epic Login is off (`APP_EPIC_ENABLED` is not `true`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/epic/launch:
    get:
      tags: [Authentication]
      summary: Start an Epic Login (EHR launch)
      description: |
        The launch URL registered with Epic, which Epic opens in the clinician's
        system browser (Epic Login, ADR 0013, D1). Every launch is a fresh Login
        (D9): any session the browser holds is ended here, whoever it belongs
        to, and the launch continues in a new one.

        `iss` must equal `APP_EPIC_FHIR_BASE` exactly (D10) and `launch` must be
        present; the launch is then held in the new session and the browser is
        sent on to `/api/auth/epic/authorize`. Anything else lands at
        `/?signin=refused`, with no further detail.

        Public: the browser arrives from Epic with no session of ours. A
        navigation, not an API call: every answer is a redirect.
      operationId: launchEpicLogin
      security: []
      parameters:
        - name: iss
          in: query
          description: The FHIR base Epic launched from; must be `APP_EPIC_FHIR_BASE` exactly.
          schema:
            type: string
        - name: launch
          in: query
          description: Epic's opaque launch context, sent on to its authorization endpoint.
          schema:
            type: string
      responses:
        "302":
          description: |
            To `/api/auth/epic/authorize` for an accepted launch, or to
            `/?signin=refused` for a refused one, its session ended.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
        "404":
          description: Epic Login is off (`APP_EPIC_ENABLED` is not `true`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/epic/authorize:
    get:
      tags: [Authentication]
      summary: Redirect to Epic's authorization endpoint
      description: |
        The internal hop between the launch and Epic (flow step 2). With a launch
        pending, the browser is redirected to Epic's discovered
        `authorization_endpoint` with `response_type=code`, `client_id`, the
        registered `redirect_uri`, `scope=launch openid fhirUser`, the pending
        `launch`, `aud` set to `APP_EPIC_FHIR_BASE`, a `state`, a `nonce`, and a
        PKCE S256 `code_challenge`. The pending request is kept in the session.

        Epic's endpoints come from OIDC discovery, read here on first use and kept
        for 24 hours (D26). When Epic gives no answer within the read or connect
        timeout, or answers `5xx`, the browser lands at `/?signin=unavailable`; a
        discovery answer that is no usable document lands at `/?signin=refused`.
        With no launch pending it lands at `/?signin=refused`. Either way its
        session is ended (D23, D24).
      operationId: authorizeEpicLogin
      security: []
      responses:
        "302":
          description: >-
            To Epic's authorization endpoint, to `/?signin=refused`, or — Epic
            unavailable — to `/?signin=unavailable`.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
        "404":
          description: Epic Login is off (`APP_EPIC_ENABLED` is not `true`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/epic/callback:
    get:
      tags: [Authentication]
      summary: Complete an Epic Login
      description: |
        The redirect URI registered with Epic, whose absolute URL is
        `APP_EPIC_REDIRECT_URI` (flow steps 3–7). The pending request is taken
        out of the session, `state` is checked, and the code is redeemed once at
        Epic's token endpoint with the PKCE verifier and our `private_key_jwt`
        client assertion. The `id_token` is validated against Epic's JWKS, and its
        `fhirUser` must be `{APP_EPIC_FHIR_BASE}/Practitioner/{id}`. The User
        whose `userName` equals that id exactly is signed in as password Login
        would sign it in — the same authorities, a rotated session id, the
        pre-login CSRF token dropped — and the browser lands at `/`, where the
        SPA's `GET /api/auth/me` takes over. Epic's access token and the rest of
        its token response are discarded (D8).

        Any OAuth error or failed check lands at `/?signin=refused`. Epic being
        unavailable — no answer within the timeouts, or a `5xx`, from discovery,
        the JWKS or the token endpoint — lands at `/?signin=unavailable` instead.
        The token call is made exactly once, never retried (D26). Either way the
        session is ended, with no further detail (D23, D24).

        Served by the OAuth 2.0 login filter on the application chain rather than
        by a controller.
      operationId: completeEpicLogin
      security: []
      parameters:
        - name: code
          in: query
          description: Epic's single-use authorization code.
          schema:
            type: string
        - name: state
          in: query
          description: The `state` the authorize redirect sent.
          schema:
            type: string
      responses:
        "302":
          description: >-
            To `/` signed in, to `/?signin=refused`, or — Epic unavailable — to
            `/?signin=unavailable`.
          headers:
            Location:
              description: Where the browser goes next.
              schema:
                type: string
        "404":
          description: Epic Login is off (`APP_EPIC_ENABLED` is not `true`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/self:
    get:
      tags: [Authentication]
      summary: Read the caller's own record
      description: |
        The signed-in User's own record, and no one else's. The User is the one
        the SESSION belongs to — the stable id the login recorded in it — never
        a value from the request: the operation takes no path, query, header or
        body parameter, so a request supplying another User's id or userName is
        not refused but simply never read, and `/api/self/{anything}` is no
        route. Every field is read from the directory at request time, so a
        rename, a membership change or a newly set change-required flag since
        login is reported as it stands.

        The lockout state and the failed-login count are omitted by shape — the
        schema has no field for either — because telling a caller how close it
        is to a lock helps someone guessing its password more than it helps the
        owner.

        Self-service: needs an authenticated session with baseline access and no
        Permission. A session confined by the change-required flag lacks baseline
        access, so it is refused with 403, as every operation beyond its three is;
        it reads its own requirement from `GET /api/auth/me`.
      operationId: getSelf
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The caller's own record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfRecord"
        "401":
          description: |
            No authenticated session, or a session that names no live User. No
            body.
        "403":
          description: |
            The session is confined by the change-required flag and lacks
            baseline access. No body.
  /api/session:
    get:
      tags: [Session]
      summary: Get session state
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Session]
      summary: Update session state
      operationId: updateSession
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
    delete:
      tags: [Session]
      summary: Delete the current session
      operationId: deleteSession
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The session was invalidated.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CsrfTokenRejected"
  /api/count:
    get:
      tags: [Counter]
      summary: Get the authenticated user's count
      description: |
        Requires `counter:read`, a baseline Permission every active User holds,
        so only a session confined by a required password change is refused.
      operationId: getCount
      security:
        - sessionCookie: [counter:read]
      responses:
        "200":
          description: The current count, or zero if the user has not incremented it yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
  /api/count/increment:
    post:
      tags: [Counter]
      summary: Increment the authenticated user's count
      operationId: incrementCount
      security:
        - sessionCookie: [counter:write]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The incremented count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The CSRF token is missing or stale (see `CsrfTokenRejected`), or the
            caller does not hold `counter:write` (see `PermissionRequired`).
  /api/count/reset:
    post:
      tags: [Counter]
      summary: Reset the authenticated user's count
      operationId: resetCount
      security:
        - sessionCookie: [counter:write]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The reset count, which is zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The CSRF token is missing or stale (see `CsrfTokenRejected`), or the
            caller does not hold `counter:write` (see `PermissionRequired`).
  /api/admin/accounts:
    get:
      tags: [Administration]
      summary: List the Users projection
      description: |
        The Accounts page's Users view: every SCIM User with its directory-owned
        identity, active flag and direct Groups, and its application-owned
        credential, lockout, change-required and last-authentication state.
        Requires `user:read`: a caller without it is refused with 403, by the
        handler's own declaration and by the application chain's matching rule.

        READ-ONLY for everything the directory owns. No operation under
        `/api/admin/accounts` accepts a `userName`, `displayName`, `active` flag
        or Group membership: `PUT`, `PATCH` and `DELETE` on the collection or on
        a User are undeclared, and the application chain, which denies by
        default, refuses them with 403. The directory changes those over SCIM.

        The response never contains a password hash. It is serialised from a
        projection that has no field for one, so the guarantee is structural
        rather than a matter of review discipline.
      operationId: listAccounts
      security:
        - sessionCookie: [user:read]
      responses:
        "200":
          description: Every account, ordered by username.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
  /api/admin/accounts/{id}/unlock:
    post:
      tags: [Administration]
      summary: End a lockout
      description: |
        Clears the failure run and the recorded `locked_at` and `lock_cause`, which
        is the only way a lockout ends, whatever its cause: a lockout has no
        duration and never lifts on its own. Says
        nothing about `active`: an inactive User can be unlocked and stays
        inactive. Addressed by the User's stable id; a `userName` in its place is
        a malformed id and is answered `400`.

        Lifting a lockout also restarts the dormancy window
        (`lastAuthenticatedAt` becomes now), so the next dormancy run does not
        lock again an account that has not yet had the chance to sign in.

        Lifting a lockout always sets the change-required flag on an account that
        has a password, because the credential that reached the threshold may be
        the one being guessed: the account then authenticates into the change
        flow and is confined to it until a new password is set. A credentialless
        account is unlocked without the flag — it has no password to replace. The
        flag is not a SCIM attribute, so the version does not advance.

        Idempotent — an account serving no lockout is answered 200 with nothing
        written and no change required.
      operationId: unlockUser
      security:
        - sessionCookie: [user:write]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The caller does not hold `user:write` (see `PermissionRequired`), or
            the target is the caller's own account, whatever Permissions it holds:
            recovering from a self-inflicted lockout takes a second administrator.
        "400":
          $ref: "#/components/responses/MalformedUserId"
        "404":
          $ref: "#/components/responses/UnknownAccount"
  /api/admin/accounts/{id}/force-password-change:
    post:
      tags: [Administration]
      summary: Require an account to change its password
      description: |
        Sets the change-required flag and ends every session the account holds,
        so from its next login it is confined to `POST /api/auth/change-password`
        and logout. The Admin never sees, chooses or transports a password. Records a
        `PASSWORD_CHANGE_REQUIRE` audit event, refusals included.

        Idempotent — an account already flagged is answered 200 unchanged.
      operationId: forcePasswordChange
      security:
        - sessionCookie: [user:write]
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          $ref: "#/components/responses/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The caller does not hold `user:write` (see `PermissionRequired`); or
            the target is the caller's own account, whatever Permissions it holds
            — the Bootstrap Admin's included; or the target is the Bootstrap Admin,
            whose password change nobody may force.
        "400":
          $ref: "#/components/responses/MalformedUserId"
        "404":
          $ref: "#/components/responses/UnknownAccount"
        "409":
          description: |
            The account has no password, so there is no credential to replace. Not
            403: the caller holds the right Permission, the action itself is refused.
  /api/admin/groups:
    get:
      tags: [Administration]
      summary: List the Groups projection
      description: |
        The Accounts page's Groups view: every SCIM Group with its direct member
        count and whether it is the protected, server-seeded Admin group.
        Requires `group:read`.

        READ-ONLY in its entirety. Groups and their membership are written by a
        connector over SCIM; this namespace declares no write operation on them,
        so `POST`, `PUT`, `PATCH` and `DELETE` here or on `/api/admin/groups/{id}`
        are undeclared and refused with 403 by the application chain, which
        denies by default.
      operationId: listGroups
      security:
        - sessionCookie: [group:read]
      responses:
        "200":
          description: Every Group, ordered by normalized display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
  /api/admin/roles:
    get:
      tags: [Administration]
      summary: List the Roles and the role mapping
      description: |
        Every Role the deployment's role mapping defines, with the Permissions it
        holds and the Groups that confer it — each Group by its stable id and its
        current `displayName` — and the Superuser Group marked. Requires
        `group:read`: the Groups projection answers who is in which Group, this
        answers what each Group grants.

        READ-ONLY in its entirety. Roles and the mapping are deployment
        configuration, fixed for the life of the process (see the backend
        README's "Role mapping"); no endpoint creates, changes or deletes a Role
        or a mapping entry, so `POST`, `PUT`, `PATCH` and `DELETE` here are
        undeclared and refused with 403 by the application chain, which denies by
        default. A Role is ASSIGNED by Group membership, which a connector writes
        over SCIM — so `group:write` on a mapped Group is Role assignment.
      operationId: listRoles
      security:
        - sessionCookie: [group:read]
      responses:
        "200":
          description: |
            Every defined Role, ordered by name, each with its Permissions ordered
            by name and its Groups in mapping order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
  /api/admin/connectors:
    get:
      tags: [Connectors]
      summary: List SCIM connectors and the state of their tokens
      description: |
        Every live connector, alphabetically, each with every token it has ever
        held (newest issue first). A deleted connector is omitted.

        The response never contains a token value or its hash. It is serialised
        from a projection that has no field for either, so the guarantee is
        structural rather than a matter of review discipline — the same
        arrangement `AccountSummary` uses for the password hash.

        `active` is the server's own evaluation at the moment it answers, not a
        comparison the client makes against its own clock.
      operationId: listConnectors
      security:
        - sessionCookie: [connector:read]
      responses:
        "200":
          description: Every live connector.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
    post:
      tags: [Connectors]
      summary: Create a SCIM connector
      description: |
        Creates a connector holding no tokens. `displayName` is the
        administrator's own label and carries no authority: Permissions are a property of
        each token, not of the connector.
      operationId: createConnector
      security:
        - sessionCookie: [connector:write]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: The connector as created, holding no tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorSummary"
        "400":
          description: The display name is missing or longer than 200 characters.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectorRequest"
  /api/admin/connectors/{connectorId}:
    delete:
      tags: [Connectors]
      summary: Delete a SCIM connector
      description: |
        Revokes every token the connector holds and deletes every one of its
        connector-scoped `externalId` aliases, in ONE transaction. Users and
        Groups are untouched — an alias is a connector's name for a resource, not
        the resource.

        One transaction is the requirement rather than an optimisation: aliases
        gone with tokens still live would leave a credential able to write to a
        directory it can no longer address its own resources in, and the reverse
        would leave a namespace reserved by nobody.

        The connector row survives with a deletion timestamp, so an audit event
        that names it still resolves a year later. It stops being listed and stops
        authenticating immediately, and its `externalId` namespace becomes
        available to a future connector.

        Not idempotent: deleting an already-deleted connector is 404, because an
        administrator repeating a delete is likelier to have the wrong id than to
        want a second no-op.
      operationId: deleteConnector
      security:
        - sessionCookie: [connector:write]
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The connector, its tokens and its aliases are gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
        "404":
          $ref: "#/components/responses/UnknownConnector"
  /api/admin/connectors/{connectorId}/tokens:
    post:
      tags: [Connectors]
      summary: Issue a connector token
      description: |
        Mints a token and returns its plaintext. **This is the only time that value
        exists.** What is stored is a SHA-256 digest of it, so there is no
        operation that returns it again and no support path that can recover it —
        a lost token is rotated, not retrieved.

        The response carries `Cache-Control: no-store`, so the credential is not
        written to a shared cache on its way to the browser.

        `lifetimeDays` defaults to 365 and may not exceed it. A longer request is
        400 rather than a silently shortened token, so an administrator never
        walks away believing their integration has longer than it does.

        `permissions` is what the token may do over SCIM (see
        `ConnectorTokenPermissions`). **No escalation:** every Permission asked for
        must be one the calling administrator holds; otherwise `403`, and the
        refusal is audited (`CONNECTOR_TOKEN_ISSUE`, `FAILURE`,
        `PERMISSION_ESCALATION`) with the Permissions requested. The issue itself
        is audited with the Permissions granted.
      operationId: issueConnectorToken
      security:
        - sessionCookie: [connector:token]
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          $ref: "#/components/responses/IssuedConnectorToken"
        "400":
          description: |
            `permissions` is missing or empty, names something that is not a
            Permission or a Permission a token cannot carry, or `lifetimeDays` is not
            positive or exceeds 365. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenPermissionRequired"
        "404":
          $ref: "#/components/responses/UnknownConnector"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTokenRequest"
  /api/admin/connectors/{connectorId}/tokens/{tokenId}/rotate:
    post:
      tags: [Connectors]
      summary: Replace a connector token, with a bounded overlap
      description: |
        Mints a replacement with a fresh full lifetime, carrying the old token's
        Permissions or the `permissions` given, and brings the OLD token's expiry
        forward to the end of the overlap window so an integration can be
        redeployed before its current credential stops working. The replacement's
        Permissions — kept or new — must all be held by the calling administrator,
        exactly as on issue: otherwise `403`, audited (`CONNECTOR_TOKEN_ROTATE`,
        `FAILURE`, `PERMISSION_ESCALATION`) with the Permissions requested. A token
        stored before tokens carried Permissions has none to keep and must be
        rotated with `permissions`.

        The overlap ends at the EARLIER of the requested window and the expiry the
        old token already had, capped at 14 days. Three consequences worth
        stating: a request longer than 14 days is clamped rather than refused; an
        overlap longer than the token had left ends at the token's own expiry, so
        rotation can never lengthen a token's life; and a second rotation cannot
        undo the first one's shortening. `overlapDays` absent or zero ends the old
        token at this instant.

        The response discloses the replacement's plaintext once, under
        `Cache-Control: no-store`, exactly as issue does.
      operationId: rotateConnectorToken
      security:
        - sessionCookie: [connector:token]
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/TokenId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          $ref: "#/components/responses/IssuedConnectorToken"
        "400":
          description: |
            `permissions` is given but empty or names something a token cannot
            carry, or it is absent and the old token carries none. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenPermissionRequired"
        "404":
          $ref: "#/components/responses/UnknownConnector"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateTokenRequest"
  /api/admin/connectors/{connectorId}/tokens/{tokenId}/revoke:
    post:
      tags: [Connectors]
      summary: Revoke a connector token
      description: |
        Effective immediately: the next SCIM request presenting it is refused with
        `401` and `WWW-Authenticate: Bearer error="invalid_token"`, the same answer
        a token that never existed gets.

        Idempotent — a token already revoked keeps its original revocation time
        and nothing is written, though the attempt is still audited.
      operationId: revokeConnectorToken
      security:
        - sessionCookie: [connector:token]
      parameters:
        - $ref: "#/components/parameters/ConnectorId"
        - $ref: "#/components/parameters/TokenId"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: The token is no longer accepted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
        "404":
          $ref: "#/components/responses/UnknownConnector"
  /api/admin/audit-events:
    get:
      tags: [Audit]
      summary: List redacted audit events, newest first, paginated and filterable
      description: |
        The administrative read of the append-only audit trail: authentication,
        lockout, administrative, connector and token lifecycle, SCIM provisioning,
        bulk-read and scheduled-job events, newest first (ties broken by event id,
        so paging never repeats or skips an event).

        Every filter is optional and they combine with AND. `totalElements` and
        `totalPages` describe the whole filtered set, counted in the same
        snapshot as the page. A page past the end is `200` with no events.

        **Redaction is structural.** Each listed event is the stored record
        itself, which has no field a password, bearer value, token or password
        hash, `userName`, profile value or literal filter value could be written
        into: actors and resources are stable ids, classifications come from
        closed sets, `httpPath` is the matched route template and never the
        resolved path, and a bulk read carries its filter's shape (`userName eq ?`)
        and never its values.

        Reading the trail is not itself recorded. The listing is served only to a
        caller holding `audit:read`, which the Auditor Role holds without any other
        administrative power.
      operationId: listAuditEvents
      security:
        - sessionCookie: [audit:read]
      parameters:
        - name: operation
          in: query
          required: false
          description: Only events of this operation.
          schema:
            $ref: "#/components/schemas/AuditOperation"
        - name: outcome
          in: query
          required: false
          description: Only events with this outcome.
          schema:
            $ref: "#/components/schemas/AuditOutcome"
        - name: actorId
          in: query
          required: false
          description: |
            Only events whose actor is this stable id — an Admin or User for an
            authentication or administrative event, a connector for a SCIM one.
          schema:
            type: string
            format: uuid
        - name: resourceId
          in: query
          required: false
          description: Only events about this resource's stable id.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          description: Only events that occurred at or after this instant (inclusive).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Only events that occurred strictly before this instant (exclusive).
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Events per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of matching events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          description: |
            `page` is negative, `size` is outside 1–200, or a filter is not a member
            of its closed set, a UUID or an ISO-8601 instant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
  /scim/v2/ServiceProviderConfig:
    get:
      tags: [SCIM]
      summary: Read the SCIM capabilities of this deployment
      description: |
        Needs a valid connector token and no Permission (ADR 0010). The document
        describes what this deployment implements, not SCIM in general — `patch`,
        `filter` (with `maxResults` 200) and `sort` are supported, `bulk` is unsupported
        permanently with zero limits, and `etag` is supported. Discovery endpoints
        themselves ignore paging, as RFC 7644 requires, but refuse a `filter` parameter
        rather than ignoring it, because an ignored filter is indistinguishable from a
        match.
      operationId: getScimServiceProviderConfig
      security:
        - connectorBearer: []
      responses:
        "200":
          description: The capability document.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimServiceProviderConfig"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimServiceProviderConfig"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
  /scim/v2/ResourceTypes:
    get:
      tags: [SCIM]
      summary: List the SCIM resource types served
      description: |
        Needs a valid connector token and no Permission. Both User and Group: a resource type in this list is a claim that its
        endpoint answers.
      operationId: listScimResourceTypes
      security:
        - connectorBearer: []
      responses:
        "200":
          description: A ListResponse of resource-type documents.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
  /scim/v2/ResourceTypes/{resourceType}:
    get:
      tags: [SCIM]
      summary: Read one SCIM resource type
      operationId: getScimResourceType
      security:
        - connectorBearer: []
      parameters:
        - name: resourceType
          in: path
          required: true
          description: The resource type's id, e.g. `User`.
          schema:
            type: string
      responses:
        "200":
          description: The resource-type document.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimAnyResource"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimAnyResource"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
  /scim/v2/Schemas:
    get:
      tags: [SCIM]
      summary: List the SCIM schemas served
      description: |
        Needs a valid connector token and no Permission. The core User and core Group schemas, each listing exactly the
        attributes this service stores — no unimplemented core attribute and no
        extension. `password` is declared `mutability: writeOnly` and
        `returned: never`.
      operationId: listScimSchemas
      security:
        - connectorBearer: []
      responses:
        "200":
          description: A ListResponse of schema documents.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
  /scim/v2/Schemas/{schemaUri}:
    get:
      tags: [SCIM]
      summary: Read one SCIM schema
      operationId: getScimSchema
      security:
        - connectorBearer: []
      parameters:
        - name: schemaUri
          in: path
          required: true
          description: |
            The schema's URI, compared exactly — case-sensitive, because it is an
            identifier. e.g. `urn:ietf:params:scim:schemas:core:2.0:User`.
          schema:
            type: string
      responses:
        "200":
          description: The schema document.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimAnyResource"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimAnyResource"
        "403":
          $ref: "#/components/responses/ScimUnsupportedQuery"
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
  /scim/v2/Users:
    get:
      tags: [SCIM]
      summary: Query the User collection
      description: |
        RFC 7644 §3.4.2: filter, sort, page and project the Users. The same query can be
        sent as a `SearchRequest` body to `POST /scim/v2/Users/.search`, which returns the
        same result and keeps personal values in the filter out of URLs and access logs.

        **Filtering** — the complete RFC 7644 grammar over every advertised attribute:
        `eq ne co sw ew gt ge lt le pr`, `and`/`or`/`not` with the RFC's precedence
        (`not` > `and` > `or`), parentheses, schema-qualified paths, complex
        sub-attributes (`name.familyName`) and value paths
        (`emails[type eq "work" and value co "@example.com"]`). Attribute names and
        operators are case-insensitive; string values compare as each attribute's
        advertised `caseExact` says (`userName` case-insensitively, `displayName`
        exactly). A bare multi-valued attribute compares its `value`
        (`emails co "example.com"`). An attribute with no value satisfies no comparison
        except `ne`, which is defined as `not eq`; `eq null` means "has no value". The
        common attributes `id`, `externalId` (the calling connector's alias only) and
        `meta.*` are filterable too. Every literal is bound as a statement parameter.

        Refused with `400 invalidFilter`, before anything is read: malformed grammar, an
        attribute this service does not advertise, any `password` path, an operator or
        literal the attribute's type does not support (e.g. `active gt true`,
        `meta.created co "2020"`), filter text over 8 KiB (UTF-8), nesting deeper than 20
        levels, or more than 100 expressions.

        **Sorting** — one `sortBy` and `sortOrder=ascending|descending` (default
        ascending). A complex attribute needs a sub-attribute (`name` is refused,
        `name.familyName` is not); a multi-valued one sorts by its primary value, else its
        first; a missing value sorts last ascending and first descending; resources with
        equal keys are ordered by `id`. Text sorts in byte order, lower-cased first for a
        case-insensitive attribute. An unsortable `sortBy` or unknown `sortOrder` is
        `400 invalidValue`. With no `sortBy` the order is by normalized `userName`.

        **Paging** — `startIndex` is one-based and defaults to 1 (anything lower becomes
        1); `count` defaults to 100, is capped at 200, and a negative value becomes 0;
        `count=0` returns no `Resources` but still reports `totalResults`. Paging is
        stateless.

        **Audit** — one bulk-read event per query, whatever it returned (an empty result
        and a one-User page included), carrying the number of Users returned and the
        filter's shape (`userName eq ?`) — never a literal. A query refused as invalid
        read nothing and records nothing. `GET /scim/v2/Users/{id}` is not audited.
      operationId: listScimUsers
      security:
        - connectorBearer: [user:read]
      parameters:
        - $ref: "#/components/parameters/ScimFilter"
        - $ref: "#/components/parameters/ScimSortBy"
        - $ref: "#/components/parameters/ScimSortOrder"
        - $ref: "#/components/parameters/ScimStartIndex"
        - $ref: "#/components/parameters/ScimCount"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          description: A ListResponse of User resources.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
    post:
      tags: [SCIM]
      summary: Create a User
      description: |
        Requires `user:write`; a token without it is refused with `403` and
        `WWW-Authenticate: Bearer error="insufficient_scope"` before any handler runs.

        `password` is optional — a credentialless User is a supported state and
        cannot authenticate until a password is set. A supplied password is hashed
        before the resource is persisted and appears in no response, no log and no
        audit event. It must satisfy the password policy — the one `/api/auth/change-password`
        applies: 12 to 256 characters after normalization, and not containing the
        `userName` case-insensitively. A password that breaks it is refused with
        `400 invalidValue` before anything is written; the `detail` names the unmet rule
        (`TOO_SHORT`, `TOO_LONG`, `CONTAINS_USER_NAME`) and never the value, and the
        refusal is audited. Read-only attributes in the body (`id`, `meta`, `groups`) are
        ignored, as RFC 7644 requires, so a client may round-trip a resource it read;
        an attribute this service does not implement is refused with
        `400 invalidValue` rather than dropped. `active` defaults to true.

        `externalId` is scoped to the calling connector: two connectors hold
        independent aliases for one User and each sees only its own.
      operationId: createScimUser
      security:
        - connectorBearer: [user:write]
      parameters:
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "201":
          description: |
            The canonical resource. `Location` names it and `ETag` is its strong
            validator, the same string as `meta.version`.
          headers:
            Location:
              description: Absolute URI of the created User.
              schema:
                type: string
            ETag:
              description: Strong validator, e.g. `"1"`.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token lacks the operation's write Permission. Carries
            `WWW-Authenticate: Bearer error="insufficient_scope"` and no body; the
            refusal is audited (`ACCESS_DENIED`) with the generic reason, never the
            missing Permission.
        "409":
          description: A live User already holds that userName, case-insensitively.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/Users/.search:
    post:
      tags: [SCIM]
      summary: Query the User collection with a SearchRequest body
      description: |
        RFC 7644 §3.4.3. Exactly the query `GET /scim/v2/Users` answers — same filter
        grammar and limits, sorting, paging, projection and audit — written as a body, so
        the filter's personal values stay out of URLs and access logs. A `POST` that
        reads: it needs `user:read`, exactly as `GET` does.

        The body must declare exactly the `SearchRequest` schema and carry only its
        members, matched case-insensitively; an unknown member, a missing schema or a
        body that is not an object is `400 invalidSyntax`, and a member of the wrong type
        (a string `count`, a numeric `filter`) is `400 invalidValue`. `attributes` and
        `excludedAttributes` are arrays of paths and are mutually exclusive.
      operationId: searchScimUsers
      security:
        - connectorBearer: [user:read]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
      responses:
        "200":
          description: A ListResponse of User resources, as the equivalent GET returns.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/Users/{id}:
    get:
      tags: [SCIM]
      summary: Retrieve one User
      description: |
        Not audited: a single-resource read is the ordinary unit of provisioning
        traffic, and recording it would bury the collection reads that indicate an
        enumeration. An id that is not a UUID is a `404` like any other unknown id.
      operationId: getScimUser
      security:
        - connectorBearer: [user:read]
      parameters:
        - name: id
          in: path
          required: true
          description: The resource's stable SCIM id.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          description: The canonical resource.
          headers:
            ETag:
              description: Strong validator, the same string as `meta.version`.
              schema:
                type: string
            Location:
              description: Absolute URI of this User.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimUser"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "404":
          $ref: "#/components/responses/ScimNotFound"
    put:
      tags: [SCIM]
      summary: Replace a User
      description: |
        Replaces the User. The body is a complete User resource, read exactly as a create
        is — the one core User schema, a required `userName`, and no unimplemented
        attribute — and what it omits is what a replacement means:

        - an omitted optional attribute (`name`, `displayName`, `preferredLanguage`,
          `locale`, `timezone`, `emails`) becomes unassigned;
        - an omitted `active` becomes `true`, its create default, which RFC 7644 §3.5.1
          allows a replacement to assign;
        - an omitted `password` leaves the stored credential as it is and still usable,
          because a write-only secret can never be read back and resent;
        - read-only attributes (`id`, `meta`, `groups`) are ignored, so a client may PUT
          back what it read;
        - `externalId` is read-write and replaced like any optional attribute: a
          submitted value becomes the calling connector's alias, restating the stored
          value changes nothing, and omitting it removes the caller's alias (RFC 7644
          §3.5.1). Only the caller's alias is touched; another connector's alias for the
          same User is neither read nor written.

        The version — and `meta.lastModified` — advance exactly once for a write that
        changes anything, and not at all for one that restates the stored state.

        A supplied `password` goes through the password policy, in the order
        `/api/auth/change-password` applies it: first the intrinsic rules — 12 to 256
        characters after normalization, and not containing the `userName` the write leaves
        the User with, case-insensitively — and only then the password history, which
        refuses a value matching, after normalization, any of the User's three most recent
        passwords, the current one included. Each refusal is `400 invalidValue`, audited,
        and writes nothing; the `detail` names the first unmet rule (`TOO_SHORT`,
        `TOO_LONG`, `CONTAINS_USER_NAME`, or reuse), never the value. A successful change
        remembers the new password and forgets the oldest.

        **Sessions.** A write that deactivates the User (`active` true to false), sets or
        changes its password, or changes its `userName` ends every session the User holds
        — after the write commits, so a refused or rolled-back write ends nothing. An
        ordinary profile or email change ends none. The write and the revocation are each
        audited, the revocation with its outcome.

        The Bootstrap Admin cannot be written: `400 mutability`. That includes the
        calling connector's own `externalId` for it — an alias change advances the
        User's version, and no SCIM write may change that User — so no connector can
        hold an alias for it. A write that changes nothing is still audited, with no
        changed paths.
      operationId: replaceScimUser
      security:
        - connectorBearer: [user:write]
      parameters:
        - name: id
          in: path
          required: true
          description: The User's stable SCIM id. An id that is not a UUID is a `404`.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimIfMatch"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimUser"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimUser"
      responses:
        "200":
          $ref: "#/components/responses/ScimUserResource"
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token lacks the operation's write Permission. Carries
            `WWW-Authenticate: Bearer error="insufficient_scope"` and no body; the
            refusal is audited (`ACCESS_DENIED`) with the generic reason, never the
            missing Permission.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: Another live User already holds that userName.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
    patch:
      tags: [SCIM]
      summary: Modify a User
      description: |
        Applies RFC 7644 §3.5.2 operations in order. **All or nothing:** the operations
        are folded onto the stored User in memory and the result is written once, so a
        request whose last operation is refused leaves the earlier ones unapplied — a
        re-read returns the User exactly as it was. A request whose operations change
        nothing advances neither the version nor `meta.lastModified`.

        `op` is `add`, `remove` or `replace`, case-insensitively. Paths are matched
        case-insensitively and may carry the core User schema URN as a prefix:

        | `path` | Meaning |
        | --- | --- |
        | `userName`, `displayName`, `preferredLanguage`, `locale`, `timezone` | `add`/`replace` set it; `remove` unassigns it — refused for `userName`, which is required (`mutability`) |
        | `active` | `add`/`replace` set it; `remove` returns it to its default, `true` |
        | `password` | `add`/`replace` set it, through the password history; `remove` makes the User credentialless |
        | `name` | `add`/`replace` with an object merge the named sub-attributes; `remove` unassigns it |
        | `name.<sub>` | set or remove one sub-attribute |
        | `emails` | `add` appends, `replace` replaces the list, `remove` clears it |
        | `emails[<filter>]` | `add`/`replace` with an object write the named sub-attributes onto the matching values; `remove` removes them |
        | `emails[<filter>].<sub>` or `emails.<sub>` | set or remove one sub-attribute on the matching (or every) value; removing `value` is `mutability` |
        | `externalId` | `add`/`replace` set the calling connector's alias; `remove` removes it. Another connector's alias is never reached |
        | none | `add`/`replace` apply each attribute of the object value as if it were the path; read-only attributes in it are ignored; `remove` without a path is `noTarget` |

        An email value marked `primary` takes primacy from every other value.

        A value filter is one or more `<sub> eq <value>` comparisons on `value`, `type`
        or `primary`, joined by `and`; `type` compares case-insensitively, `value`
        exactly. Any other operator, `or`, `not` or grouping is `400 invalidFilter` in a
        PATCH path — the full grammar applies to queries, and a PATCH selector that
        approximated it would change values the client did not ask for.

        | Refusal | `scimType` |
        | --- | --- |
        | not a `PatchOp`, no operations, unknown `op` | `invalidSyntax` |
        | malformed path, unimplemented attribute, filter or sub-attribute where there is none | `invalidPath` |
        | unsupported filter | `invalidFilter` |
        | `id`, `meta`, `groups` or `schemas` as a path; removing a required value | `mutability` |
        | a filter that matches no value; `remove` with no path | `noTarget` |
        | a value of the wrong type; a password the policy refuses (too short, too long, containing the `userName`, or reused) | `invalidValue` |

        The password policy and its order, password history, session revocation, audit and
        Bootstrap Admin rules are those of PUT. Returns `200` with the patched resource
        rather than `204`, so the
        client learns the new ETag without re-reading.
      operationId: patchScimUser
      security:
        - connectorBearer: [user:write]
      parameters:
        - name: id
          in: path
          required: true
          description: The User's stable SCIM id. An id that is not a UUID is a `404`.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimIfMatch"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
      responses:
        "200":
          $ref: "#/components/responses/ScimUserResource"
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token lacks the operation's write Permission. Carries
            `WWW-Authenticate: Bearer error="insufficient_scope"` and no body; the
            refusal is audited (`ACCESS_DENIED`) with the generic reason, never the
            missing Permission.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: Another live User already holds that userName.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
    delete:
      tags: [SCIM]
      summary: Delete a User
      description: |
        Removes the User and everything readable about it — profile, emails,
        credential and password history, Group memberships and connector aliases —
        advances the version of every Group it was a member of, and ends every
        session it holds once the deletion commits. A refused or rolled-back
        deletion ends none.

        `204` with no body. Every later operation on the id — GET, PUT, PATCH,
        DELETE — is a `404`, and the User no longer appears in any listing.

        What remains is a tombstone holding only the stable id, the resource type
        and the deletion time (UTC). It is never consulted for uniqueness: the
        former `userName` is accepted by the next create with no conflict, as RFC
        7644 §3.6 allows. The deletion is audited as its own event naming the User
        by that stable id, followed by the session revocation's own event.

        The Bootstrap Admin cannot be deleted; the attempt is `400 mutability`,
        deletes nothing and is audited as a refusal.

        `If-Match` is optional, under the same rules as PUT and PATCH; see the
        parameter.
      operationId: deleteScimUser
      security:
        - connectorBearer: [user:write]
      parameters:
        - name: id
          in: path
          required: true
          description: The User's stable SCIM id. An id that is not a UUID is a `404`.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/ScimIfMatch"
      responses:
        "204":
          description: The User is gone.
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token lacks the operation's write Permission. Carries
            `WWW-Authenticate: Bearer error="insufficient_scope"` and no body; the
            refusal is audited (`ACCESS_DENIED`) with the generic reason, never the
            missing Permission.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
  /scim/v2/Groups:
    get:
      tags: [SCIM]
      summary: Query the Group collection
      description: |
        The User collection's query contract over Groups: the same filter grammar, limits,
        sorting, paging, projection and audit, against the Group vocabulary (`displayName`
        compares case-insensitively; `members.value`, `members.display`,
        `members.$ref` and `members.type` are filterable; a deleted User is no longer a
        member). With no `sortBy` the order is by normalized `displayName`. The same query
        can be sent to `POST /scim/v2/Groups/.search`.
      operationId: listScimGroups
      security:
        - connectorBearer: [group:read]
      parameters:
        - $ref: "#/components/parameters/ScimFilter"
        - $ref: "#/components/parameters/ScimSortBy"
        - $ref: "#/components/parameters/ScimSortOrder"
        - $ref: "#/components/parameters/ScimStartIndex"
        - $ref: "#/components/parameters/ScimCount"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          description: A ListResponse of Group resources.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
    post:
      tags: [SCIM]
      summary: Create a Group
      description: |
        Requires `group:write`; a token without it is refused with `403` and
        `WWW-Authenticate: Bearer error="insufficient_scope"` before any handler runs.

        **A Group's membership is what confers application authority**, which is why
        two rules here are stricter than RFC 7643 requires.

        `displayName` is unique across live Groups, case-insensitively, and is
        advertised as `uniqueness=server`. The RFC leaves it non-unique; this
        directory does not, because two Groups an administrator reads as the same name
        is how membership of the wrong one gets granted.

        `members` accepts **direct User members only**. A member id naming a Group, a
        deleted User, or nothing at all is one refusal — `400 invalidValue` — and they
        are deliberately indistinguishable: telling them apart would disclose the
        existence and type of resources the caller has not been shown. Nested and
        transitive membership are unsupported, and there is no representation for
        them. Every `members` sub-attribute other than `value` is read-only and
        IGNORED on write: `display` is derived from the referenced User, `$ref` is
        built from its id, and `type` is always `User`.

        An empty Group is legitimate and renders no `members` attribute at all.

        Creating a Group with members advances each member User's version, because
        that User's rendered `groups` gained an entry.

        `externalId` is scoped to the calling connector, exactly as it is for a User.
      operationId: createScimGroup
      security:
        - connectorBearer: [group:write]
      parameters:
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
      responses:
        "201":
          description: |
            The canonical resource. `Location` names it and `ETag` is its strong
            validator, the same string as `meta.version`.
          headers:
            Location:
              description: Absolute URI of the created Group.
              schema:
                type: string
            ETag:
              description: Strong validator, e.g. `"1"`.
              schema:
                type: string
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimGroup"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token lacks the operation's write Permission. Carries
            `WWW-Authenticate: Bearer error="insufficient_scope"` and no body; the
            refusal is audited (`ACCESS_DENIED`) with the generic reason, never the
            missing Permission.
        "409":
          description: A live Group already holds that displayName, case-insensitively.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/Groups/.search:
    post:
      tags: [SCIM]
      summary: Query the Group collection with a SearchRequest body
      description: |
        The Group counterpart of `POST /scim/v2/Users/.search`: exactly the query
        `GET /scim/v2/Groups` answers, written as a `SearchRequest` body, on the same
        terms. A `POST` that reads: it needs `group:read`, exactly as `GET` does.
      operationId: searchScimGroups
      security:
        - connectorBearer: [group:read]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
      responses:
        "200":
          description: A ListResponse of Group resources, as the equivalent GET returns.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/.search:
    post:
      tags: [SCIM]
      summary: Search Users and Groups together
      description: |
        RFC 7644 §3.4.3 at the service root: one `SearchRequest` over both resource
        types, returned as one ListResponse. Needs at least one of `user:read` and
        `group:read`, and returns only the types the token may read: a `user:read`-only
        token gets Users and no Groups, `totalResults` counting Users alone — the answer
        a directory holding no Groups would give, not a refusal. A token holding
        neither read Permission is refused `403`.

        A path is valid when either type has it. Where one type lacks it, the filter
        treats it as having no value there — `userName pr` selects no Group,
        `not (userName pr)` selects every Group, and `ne` is true — and a schema-qualified
        path (`urn:ietf:params:scim:schemas:core:2.0:Group:displayName`) applies to that
        type only. Projection works the same way: `attributes=["userName"]` leaves each
        Group its `schemas` and `id`. A path neither type has is refused as it is on a
        single-type endpoint.

        `totalResults` counts both types. With no `sortBy` the Users come first, each type
        in its own default order; with one, a type lacking the attribute sorts as missing.
        Audited as ONE bulk read (`SCIM_RESOURCE_LIST`, resource type `User,Group`) with
        the number of resources returned and the filter's shape.
      operationId: searchScimResources
      security:
        - connectorBearer: [user:read]
        - connectorBearer: [group:read]
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimSearchRequest"
      responses:
        "200":
          description: A ListResponse of User and Group resources, interleaved in order.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ScimListResponse"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
  /scim/v2/Groups/{id}:
    get:
      tags: [SCIM]
      summary: Retrieve one Group
      description: |
        Not audited, for the reason a single User read is not: a single-resource read
        is the ordinary unit of provisioning traffic, and recording it would bury the
        collection reads that indicate an enumeration. An id that is not a UUID — and
        an id that names a User — are both a `404` like any other unknown id.
      operationId: getScimGroup
      security:
        - connectorBearer: [group:read]
      parameters:
        - $ref: "#/components/parameters/ScimGroupId"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      responses:
        "200":
          $ref: "#/components/responses/ScimGroupResource"
        "400":
          $ref: "#/components/responses/ScimBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "404":
          $ref: "#/components/responses/ScimNotFound"
    put:
      tags: [SCIM]
      summary: Replace a Group
      description: |
        Replaces everything a connector may write: the `displayName` and the WHOLE
        membership. An attribute the document does not mention is set to nothing
        rather than left alone — that is what replacing a resource means — so a PUT
        with no `members` empties the Group.

        `externalId` is read-write and replaced the same way: a submitted value becomes
        the calling connector's alias, restating it changes nothing, and omitting it
        removes the caller's alias (RFC 7644 §3.5.1). Only the caller's alias is
        touched; another connector's alias for the same Group is neither read nor
        written. A change to the alias alone advances this Group's version and
        `meta.lastModified`, and no member's — a member's `groups` renders no alias.

        **Version increments reach other resources.** A membership change advances
        this Group's version and the version of every User added or removed. A
        `displayName` change advances this Group's version and the version of every
        CURRENT member, because the label rendered inside their `groups` changed. A
        write that moves both touches the union of the old and the new membership.

        `If-Match` is optional; when sent it must be the Group's current ETag. See
        the parameter.
      operationId: replaceScimGroup
      security:
        - connectorBearer: [group:write]
      parameters:
        - $ref: "#/components/parameters/ScimGroupId"
        - $ref: "#/components/parameters/ScimIfMatch"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimGroup"
      responses:
        "200":
          $ref: "#/components/responses/ScimGroupResource"
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token lacks the operation's write Permission. Carries
            `WWW-Authenticate: Bearer error="insufficient_scope"` and no body; the
            refusal is audited (`ACCESS_DENIED`) with the generic reason, never the
            missing Permission.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: Another live Group already holds that displayName.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
    patch:
      tags: [SCIM]
      summary: Modify a Group
      description: |
        The operation a provisioning system uses to grant or revoke a membership
        without resending the whole Group — which a PUT would force it to do, and
        which would overwrite concurrent changes it never read.

        **Partial failure applies nothing.** The operations are folded into one
        desired state and written once, so a sequence whose third operation is refused
        leaves the first two unapplied: there is no intermediate state to roll back,
        because none was ever written.

        Each operation requires a `path`, and the supported paths are a closed set —
        a Group has three writable attributes. Paths and `op` are matched
        case-insensitively, and a path may carry the core Group schema URN as a prefix:

        | `op` | `path` | Meaning |
        | --- | --- | --- |
        | `add`, `replace` | `displayName` | Set the label. The attribute is single-valued, so adding to it replaces it (RFC 7644 §3.5.2.1). |
        | `remove` | `displayName` | Refused with `mutability`: `displayName` is required. |
        | `add` | `members` | Add the named Users, leaving existing members in place. An id already present is a no-op, not a conflict. |
        | `replace` | `members` | Replace the whole membership. |
        | `remove` | `members` | With a value, remove the named Users; with none, clear the membership. Removing a non-member is a no-op. |
        | `remove` | `members[value eq "<id>"]` | Remove one member. The only value-path form accepted, because it is the one that occurs. |
        | `add`, `replace` | `externalId` | Set the calling connector's alias. Single-valued, so adding replaces it. |
        | `remove` | `externalId` | Remove the calling connector's alias. Another connector's alias is never reached. |

        | Refusal | `scimType` |
        | --- | --- |
        | not a `PatchOp`, no operations | `invalidSyntax` |
        | an unimplemented path, or a members value path on anything but `remove` | `invalidPath` |
        | `id`, `meta` or `schemas` as a path; removing `displayName` | `mutability` |
        | `remove` with no path (RFC 7644 §3.5.2.2) | `noTarget` |
        | `add`/`replace` with no path, an unknown `op`, a value of the wrong type, a member that is not a live User, more than 100 operations | `invalidValue` |

        Returns `200` with the patched resource rather than `204`, which RFC 7644
        permits either of: a membership change advances versions, and a client given
        no body would have to re-read the resource to learn its new ETag.

        The same cross-resource version increments, and the same optional `If-Match`
        precondition, apply as for PUT.
      operationId: patchScimGroup
      security:
        - connectorBearer: [group:write]
      parameters:
        - $ref: "#/components/parameters/ScimGroupId"
        - $ref: "#/components/parameters/ScimIfMatch"
        - $ref: "#/components/parameters/ScimAttributes"
        - $ref: "#/components/parameters/ScimExcludedAttributes"
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
          application/json:
            schema:
              $ref: "#/components/schemas/ScimPatchOp"
      responses:
        "200":
          $ref: "#/components/responses/ScimGroupResource"
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token lacks the operation's write Permission. Carries
            `WWW-Authenticate: Bearer error="insufficient_scope"` and no body; the
            refusal is audited (`ACCESS_DENIED`) with the generic reason, never the
            missing Permission.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "409":
          description: Another live Group already holds that displayName.
          content:
            application/scim+json:
              schema:
                $ref: "#/components/schemas/ScimError"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
        "415":
          $ref: "#/components/responses/ScimUnsupportedMediaType"
    delete:
      tags: [SCIM]
      summary: Delete a Group
      description: |
        Removes the Group and its memberships, and advances the version of every User
        that was a member — their `groups` just lost an entry.

        `204` with no body. A Group that is not there is a `404` rather than a silent
        success: a connector converging on a desired state needs to know whether the
        id it holds was ever real.

        The Admin group cannot be deleted; the attempt is `400 mutability` and removes
        nothing. What remains of a deleted Group is a tombstone holding only its
        stable id, the resource type and the deletion time; it is never consulted for
        uniqueness, so the former `displayName` is accepted by the next create.

        `If-Match` is optional; when sent it must be the Group's current ETag. See
        the parameter.
      operationId: deleteScimGroup
      security:
        - connectorBearer: [group:write]
      parameters:
        - $ref: "#/components/parameters/ScimGroupId"
        - $ref: "#/components/parameters/ScimIfMatch"
      responses:
        "204":
          description: The Group is gone.
        "400":
          $ref: "#/components/responses/ScimProtectedOrBadRequest"
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "403":
          description: |
            The token lacks the operation's write Permission. Carries
            `WWW-Authenticate: Bearer error="insufficient_scope"` and no body; the
            refusal is audited (`ACCESS_DENIED`) with the generic reason, never the
            missing Permission.
        "404":
          $ref: "#/components/responses/ScimNotFound"
        "412":
          $ref: "#/components/responses/ScimPreconditionFailed"
  /scim/v2/Me:
    get:
      tags: [SCIM]
      summary: Not implemented — /Me
      description: |
        RFC 7644 §3.11's alias for the authenticated User. A connector token
        represents a directory, not an end User, so `/Me` has nothing to name:
        every method is `501` once the credential is accepted.
      operationId: getScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
    post:
      tags: [SCIM]
      summary: Not implemented — /Me
      operationId: createScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
    put:
      tags: [SCIM]
      summary: Not implemented — /Me
      operationId: replaceScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
    patch:
      tags: [SCIM]
      summary: Not implemented — /Me
      operationId: patchScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
    delete:
      tags: [SCIM]
      summary: Not implemented — /Me
      operationId: deleteScimMe
      security:
        - connectorBearer: []
      responses:
        "401":
          $ref: "#/components/responses/ScimUnauthenticated"
        "501":
          $ref: "#/components/responses/ScimNotImplemented"
  /actuator/health:
    get:
      tags: [Health]
      summary: Get application health
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The application is healthy.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The application is unhealthy.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /actuator/prometheus:
    get:
      tags: [Health]
      summary: Scrape operational telemetry
      operationId: scrapeMetrics
      security:
        - sessionCookie: [ops:read]
      description: |
        Prometheus text exposition of the service's operational telemetry: request
        count and latency histogram (`http_server_requests_seconds`) tagged by route
        template, method, status, status class (`outcome`), `scim_resource_type`,
        `scim_type` and `scim_connector`; database-pool, Tomcat-thread, Redis and
        scheduled-job saturation gauges. No tag carries a userName, externalId,
        resource id, filter text or token value.

        Requires `ops:read` — the Monitoring Role holds it alone, so a scraper's
        account can do nothing else — decided by the filter chain, since an actuator
        endpoint has no handler of its own to declare it: a session without it gets
        403. A connector bearer token is not a
        credential on this path and gets 401. Deployments may move it to an internal
        management port (`MANAGEMENT_SERVER_PORT`), where the same rule applies.
      responses:
        "200":
          description: The current scrape.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
  /actuator/info:
    get:
      tags: [Health]
      summary: Read the build and application info
      operationId: getInfo
      security:
        - sessionCookie: [ops:read]
      description: |
        Spring Boot's info endpoint, exposed beside the scrape and under the same rule:
        `ops:read`, decided by the filter chain. It carries whatever
        `InfoContributor`s the deployment enables, which by default is nothing, so
        the body is an empty object.
      responses:
        "200":
          description: The info document.
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PermissionRequired"
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: HTTP session created by a successful login.
    connectorBearer:
      type: http
      scheme: bearer
      description: |
        An opaque connector token issued by an administrator of this deployment,
        presented as `Authorization: Bearer <value>` on every SCIM request, discovery
        included. Accepted in that header and nowhere else — never from a query
        string, a form body or a cookie. There is no authorization server and no
        grant flow. A token carries Permissions (`user:read`, `user:write`,
        `group:read`, `group:write`); an operation's `connectorBearer` requirement
        names the one it needs, `[]` meaning a valid token alone, and the base
        `/.search` lists two alternatives, either of which suffices.
  parameters:
    ScimFilter:
      name: filter
      in: query
      required: false
      description: |
        An RFC 7644 §3.4.2.2 filter, e.g. `userName eq "bjensen" and emails[type eq "work"]`.
        See the collection operation for the grammar, the semantics and the limits
        (8 KiB, 20 levels, 100 expressions). Prefer the `.search` endpoint when the
        filter carries personal values. An invalid filter is `400 invalidFilter`.
      schema:
        type: string
        maxLength: 8192
    ScimSortBy:
      name: sortBy
      in: query
      required: false
      description: |
        One attribute path to sort by — a simple attribute or a sub-attribute, never a
        complex attribute itself, never `password`. Unsortable is `400 invalidValue`.
      schema:
        type: string
    ScimSortOrder:
      name: sortOrder
      in: query
      required: false
      description: |
        `ascending` (the default) or `descending`, case-insensitive; ignored without a
        `sortBy`. Anything else is `400 invalidValue`.
      schema:
        type: string
        enum: [ascending, descending]
    ScimStartIndex:
      name: startIndex
      in: query
      required: false
      description: |
        One-based index of the first resource to return. Defaults to 1; anything below
        1 is coerced to 1 rather than refused, as RFC 7644 asks.
      schema:
        type: integer
    ScimCount:
      name: count
      in: query
      required: false
      description: |
        Page size. Defaults to 100 and is capped at 200; a negative value becomes 0,
        and 0 returns no `Resources` while still reporting `totalResults`.
      schema:
        type: integer
    ScimAttributes:
      name: attributes
      in: query
      required: false
      description: |
        Comma-separated attribute paths to return, beside the always-returned
        `schemas` and `id`. Mutually exclusive with `excludedAttributes`. Names are
        case-insensitive and may be schema-qualified; a sub-attribute path such as
        `name.givenName` narrows a complex value. A path this service does not
        implement is `400 invalidValue`. `password` is declared `returned: never`, so
        requesting it yields a resource without it rather than an error.
      schema:
        type: string
    ScimExcludedAttributes:
      name: excludedAttributes
      in: query
      required: false
      description: |
        Comma-separated attribute paths to omit. Mutually exclusive with `attributes`;
        an always-returned attribute survives being named here.
      schema:
        type: string
    ScimGroupId:
      name: id
      in: path
      required: true
      description: |
        The Group's stable SCIM id. An id that is not a UUID, and an id that names a
        User rather than a Group, are both a `404` — the id namespace is shared, so
        "not a Group" and "not there" are the same answer and are deliberately not
        told apart.
      schema:
        type: string
        format: uuid
    ScimIfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Optional, as RFC 7644 §3.14 makes it for clients. When sent, exactly one strong
        entity tag: the `ETag` (equivalently `meta.version`) of the resource as the
        client last read it, e.g. `"7"`. Accepted on every PUT, PATCH and DELETE against
        an existing User or Group. Several connectors may write the same directory, so
        a client that sends it gets exact lost-update protection; a client that does
        not gets last-writer-wins.

        Checked AFTER authorization and existence — a token without the write Permission
        is refused as `403` and an unknown id is `404` whatever this header says — and BEFORE
        anything is computed or written, so a refused precondition changes nothing.

        | Sent | Result |
        | --- | --- |
        | nothing | the write proceeds unconditionally — last writer wins |
        | `*`, a list of tags, a repeated header, or not an entity tag | `400 invalidValue` |
        | one well-formed tag that is not the current version, or a weak `W/` tag | `412` |
        | the current version's exact tag | the write proceeds |

        Two writers holding the same current tag are serialized on the resource: one
        succeeds, and the other then finds the version it holds is stale and receives
        `412`. Unconditional writers are serialized the same way, so neither sees the
        other half-applied: both succeed, each advancing the version once.
      schema:
        type: string
    UserId:
      name: id
      in: path
      required: true
      description: |
        The User to act on, by its stable SCIM resource id — never its `userName`,
        which a connector may change between the Admin reading the row and acting
        on it.
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: |
        The session's CSRF token as `GET /api/auth/csrf` returned it, in the header
        that response names.
      schema:
        type: string
    ConnectorId:
      name: connectorId
      in: path
      required: true
      description: The connector's stable id.
      schema:
        type: string
        format: uuid
    TokenId:
      name: tokenId
      in: path
      required: true
      description: |
        The token's stable id, as the listing reports it. Not the token value — the
        value is never sent to this service in a URL.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: A valid authenticated session is required.
    CsrfTokenRejected:
      description: |
        The CSRF token is missing, or is not the token of the caller's own HTTP
        session — including one fetched before the session was rotated by login,
        or one whose session has since ended. This is decided before
        authentication, so it is returned even on the public login operation.
    AdminAccount:
      description: The account as it stands after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountSummary"
    UnknownAccount:
      description: |
        No User has that id. The body is empty; the caller is already an
        administrator, so this reveals nothing the listing would not.
    MalformedUserId:
      description: |
        The path segment is not a UUID — for instance a `userName` where the id
        belongs. Nothing is written.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InvalidRequest:
      description: The request body is missing, malformed, or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnknownConnector:
      description: |
        No live connector or token has that id. The body is empty, and "never
        existed" and "already deleted" are the same answer: the caller is an
        administrator who can read either from the listing.
    IssuedConnectorToken:
      description: |
        The token, including its plaintext — the only time that value is disclosed.
        Sent with `Cache-Control: no-store`.
      headers:
        Cache-Control:
          description: Always `no-store`; a credential may not be cached.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IssuedConnectorToken"
    PermissionRequired:
      description: |
        The session is valid and was accepted; the caller does not hold the
        Permission this operation declares in its `security` requirement, so it
        was refused. Distinct from 401, which means no usable session arrived at
        all — a client must not treat this as a signal to sign in again. A session
        confined by the change-required flag holds no Permission, so it receives
        this on every endpoint but the change flow, a Superuser's included.

        Bodiless, and generic on purpose: it never names the missing Permission,
        a Role or the rule that refused. The refusal is audited
        (`ACCESS_DENIED`) and logged at `WARN` with the caller, the operation and
        the reason `insufficient-permissions`.
    TokenPermissionRequired:
      description: |
        Either the caller does not hold `connector:token` — the generic refusal
        `PermissionRequired` describes — or it does, and the token would carry a
        Permission the caller does not hold itself: no administrator can mint a
        credential more powerful than itself. Bodiless in both cases. The second is
        audited as a `FAILURE` of the issue or rotation with `errorCode`
        `PERMISSION_ESCALATION` and the Permissions requested.
    ScimBadRequest:
      description: |
        The request was not acceptable SCIM: an unparseable or non-object body, a
        schema other than this service's one User schema, a missing required
        attribute, an attribute or sub-attribute this service does not implement, a
        value of the wrong JSON type, a value longer than its stored `maxLength` or
        holding a character it refuses (see "Forbidden characters"), or a
        projection naming something that is not an attribute. `scimType` is
        `invalidSyntax` or `invalidValue`; for a query also
        `invalidFilter`, and for a PATCH also `invalidPath`, `noTarget` or
        `mutability` — see the operation.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimInsufficientPermissions:
      description: |
        A valid token lacking the Permission the request needs — the one its
        operation declares in `security` (for the base `/.search`, either read
        Permission). `WWW-Authenticate: Bearer error="insufficient_scope"`
        and no body. Decided from the method and path before any handler runs,
        logged at `WARN` with the reason `insufficient-permissions` and audited
        (`ACCESS_DENIED`, the connector as actor) — never naming the Permission.
    ScimUnauthenticated:
      description: |
        No bearer token, or one that is malformed, unknown, expired, revoked or whose
        connector was deleted. `WWW-Authenticate` is a bare `Bearer` when no
        credential was presented and `Bearer error="invalid_token"` when one was; the
        several reasons are not told apart, because telling them apart reports whether
        a credential ever existed. No body.
    ScimUnsupportedQuery:
      description: |
        A `filter` parameter on a discovery path, which RFC 7644 says discovery ignores.
        `403` rather than a silently ignored parameter, because an ignored filter is the
        only answer a client cannot tell from a match. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotFound:
      description: |
        No live resource, schema or resource type has that identifier.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimPreconditionFailed:
      description: |
        The `If-Match` names a version that is no longer current — another write changed
        the resource first. Nothing was changed; GET it and retry.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimUserResource:
      description: |
        The canonical User resource, never carrying a password. `ETag` is its new strong
        validator, the same string as `meta.version`.
      headers:
        ETag:
          description: Strong validator, e.g. `"2"`.
          schema:
            type: string
        Location:
          description: Absolute URI of this User.
          schema:
            type: string
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimUser"
        application/json:
          schema:
            $ref: "#/components/schemas/ScimUser"
    ScimGroupResource:
      description: |
        The canonical Group resource. `ETag` is its strong validator, the same string
        as `meta.version`.
      headers:
        ETag:
          description: Strong validator, e.g. `"1"`.
          schema:
            type: string
        Location:
          description: Absolute URI of this Group.
          schema:
            type: string
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimGroup"
        application/json:
          schema:
            $ref: "#/components/schemas/ScimGroup"
    ScimProtectedOrBadRequest:
      description: |
        Either the request was not acceptable SCIM — see `ScimBadRequest`, `scimType`
        `invalidSyntax` or `invalidValue`, which also covers a member id that does not
        name a live User — or it targeted a resource this deployment reserves for its
        own recovery, with `scimType` `mutability`.

        **The reserved resources and what is refused about them:** the Admin group
        cannot be renamed or deleted, and the Bootstrap Admin's Group membership
        cannot be changed in either direction — it cannot be removed from the Admin
        group and cannot be added to any other Group, because a membership change
        moves that User's computed `groups` and its version, which a client reads.
        The Admin group's ORDINARY membership stays fully writable: granting and
        revoking administrative access is what external provisioning is for. So does
        the calling connector's own `externalId` for it: the alias is that connector's
        name for the Group, invisible to every other connector, and setting or
        removing it renames nothing and changes no one's authority.

        `400` rather than `403` deliberately. The token may hold every Permission
        it needs; it is the TARGET that is refused, not the credential, and
        answering `403` would send an integrator to re-check token Permissions that
        are fine.

        A refused write changes nothing: every check runs before anything is written,
        so the resource re-reads unchanged, version included.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimUnsupportedMediaType:
      description: |
        The request body is neither `application/scim+json` nor `application/json`.
        Refused before the body is read; nothing is written. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNoSuchEndpoint:
      description: |
        No endpoint is served at this path — including `/scim/v2/Bulk`, which this
        service does not implement and discovery advertises as unsupported — or the
        deployment has closed the SCIM release gate. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimMethodNotAllowed:
      description: |
        The path is served but not for this method — e.g. `PUT /scim/v2/Users`.
        Carries an `Allow` header listing the methods that are. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotAcceptable:
      description: |
        The `Accept` header names neither `application/scim+json` nor
        `application/json`, the only representations served. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimPayloadTooLarge:
      description: |
        The request body exceeds 1 MiB. A body that declares its length is refused
        on that declaration, before it is read and before the credential is
        checked; one sent without a length is refused as it crosses the bound.
        Either way nothing is written. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
    ScimNotImplemented:
      description: |
        `/Me` is defined by RFC 7644 §3.11 as an alias for the authenticated User,
        and a connector token does not represent a User, so there is nothing it
        could name. `501` for every method, after authentication. No `scimType`.
      content:
        application/scim+json:
          schema:
            $ref: "#/components/schemas/ScimError"
  schemas:
    JwkSet:
      type: object
      additionalProperties: false
      required: [keys]
      description: |
        A JSON Web Key Set (RFC 7517) of EC P-384 public signing keys. The
        closed property list is the guarantee that no private parameter (`d`)
        is published.
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 2
          description: The active key, then the next key when one is configured.
          items:
            type: object
            additionalProperties: false
            required: [kty, crv, x, y, kid, use, alg]
            properties:
              kty:
                type: string
                enum: [EC]
              crv:
                type: string
                enum: [P-384]
              x:
                type: string
                description: The public point's x coordinate, base64url (RFC 7518).
              y:
                type: string
                description: The public point's y coordinate, base64url (RFC 7518).
              kid:
                type: string
                description: The key's configured `kid`.
              use:
                type: string
                enum: [sig]
              alg:
                type: string
                enum: [ES384]
    ApiError:
      type: object
      required: [status, code, detail]
      additionalProperties: false
      description: |
        The application API's error body, written by its app-wide handler for a
        request it could not read or validate (`400`), another refusal Spring MVC
        assigns, or a failure on the server side (`5xx`). Nothing in it comes from
        the request or from the failure — no path, field, rejected value, exception
        type or message — so every failure of one kind has the same body. A refusal
        a handler renders itself (`PasswordRuleViolation`, the bodiless `401`s,
        `403`s, `404`s and `409`s) keeps its own shape, and the SCIM namespace
        answers with SCIM error documents.
      properties:
        status:
          type: integer
          description: The response status, repeated.
        code:
          type: string
          enum: [invalid-request, request-refused, server-error]
          description: |
            What a client branches on: `invalid-request` for a `400`,
            `server-error` for a `5xx`, `request-refused` for any other status.
        detail:
          type: string
          description: A fixed sentence per `code`, for a person reading the response.
    LoginRequest:
      type: object
      required: [username, password]
      description: |
        Both fields are bounded before any credential is checked. A value over
        its `maxLength` is the same `400` as a blank or missing one: it
        is not counted toward the failure run, not audited, and cannot be told
        apart from any other malformed body.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ".*\\S.*"
          description: At most 256 characters, the stored `userName` bound.
        password:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ".*\\S.*"
          format: password
          description: |
            At most 256 characters of the normalized form, the password policy's
            own maximum, so no password the policy accepted is refused here.
    UserResponse:
      type: object
      required:
        [username, permissions, passwordChangeRequired, idleTimeoutSeconds]
      properties:
        username:
          type: string
        permissions:
          type: array
          items:
            type: string
            enum:
              - audit:read
              - connector:read
              - connector:token
              - connector:write
              - counter:read
              - counter:write
              - group:read
              - group:write
              - ops:read
              - user:read
              - user:write
          description: |
            The Permissions this session was issued with, sorted by name, each once. They
            are the baseline `counter:read` and `counter:write`, which every active
            User holds, together with the union of the Roles of every mapped Group the User was a
            direct member of when it signed in (the role mapping, see the
            backend README's "Role mapping"), so a change of membership is seen
            at the next sign-in. Only the baseline two for a User in no mapped Group, and
            empty while `passwordChangeRequired` is true.
            What the SPA shows is decided from this list; what the server allows is
            decided by each operation's own declaration, never by the SPA.
        passwordChangeRequired:
          type: boolean
          description: |
            Whether this session is confined to the change flow. While true, the
            session may call `GET /api/auth/me`, `POST /api/auth/change-password`
            and `DELETE /api/auth/logout`; every other endpoint, `/api/admin/**`
            included, answers 403.
        idleTimeoutSeconds:
          type: integer
          minimum: 1
          description: |
            The idle bound this session is held to, in seconds: how long it
            survives without a request (`server.servlet.session.timeout`, 15
            minutes by default). Read off the session itself, so it is the
            figure the session actually expires by. The SPA signs an inactive
            user out by it, so its own idle limit can never outlast the
            backend's.
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required: [headerName, token]
      properties:
        headerName:
          type: string
          description: The request header an unsafe request carries the token in.
          example: X-CSRF-TOKEN
        token:
          type: string
          description: |
            The session's token, XOR-masked for this response. Send it unchanged;
            a value from another session, or from before login, is refused.
    SelfRecord:
      type: object
      additionalProperties: false
      required:
        [
          id,
          userName,
          displayName,
          groups,
          passwordChangeRequired,
          lastAuthenticatedAt,
        ]
      description: |
        The whole of what the self-read returns. There is deliberately no lockout
        or failed-login field; `additionalProperties: false` states that the set
        below is closed.
      properties:
        id:
          type: string
          format: uuid
          description: The caller's stable SCIM resource id.
        userName:
          type: string
          description: The caller's login attribute, as stored now.
        displayName:
          type: [string, "null"]
          description: The caller's display name, or `null` when none is set.
        groups:
          type: array
          description: |
            The Groups the caller is a DIRECT member of — the server-seeded Admin
            group included, when it is one — by id and label only. Empty when
            there are none.
          items:
            $ref: "#/components/schemas/SelfGroup"
        passwordChangeRequired:
          type: boolean
          description: Whether the caller's change-required flag is set.
        lastAuthenticatedAt:
          type: [string, "null"]
          format: date-time
          description: |
            When the caller last logged in successfully while no password change
            was required of it, last completed a self-service change, was last
            reactivated or was last unlocked, ISO-8601 in UTC; `null` when none has
            happened.
    SelfGroup:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
          description: The Group's stable SCIM resource id.
        displayName:
          type: string
          description: The Group's label.
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      description: |
        Both fields are bounded like Login's password: a value over 256
        characters of its normalized form is an `ApiError` `400` before the
        current password is checked, so it is not counted toward the lockout
        and not audited.
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ".*\\S.*"
          format: password
        newPassword:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ".*\\S.*"
          format: password
    PasswordRuleViolation:
      type: object
      required: [rule, message]
      description: |
        The first password-policy rule the new password failed. Names the rule;
        never echoes the current or the new value.
      properties:
        rule:
          type: string
          enum: [TOO_SHORT, TOO_LONG, CONTAINS_USER_NAME, REUSED]
          description: |
            `TOO_SHORT` below 12 characters, `TOO_LONG` above 256,
            `CONTAINS_USER_NAME` when it contains the user name (case-insensitive), `REUSED` when it
            equals the current password or one of the 3 most recent ones.
        message:
          type: string
          description: A human-readable statement of the rule.
    AccountSummary:
      type: object
      description: |
        One row of the Users projection. Directory-owned fields (`userName`,
        `displayName`, `active`, `groups`) are read-only here; the rest is
        application-owned state. Returned by the listing and, for the User acted
        on, by `unlock` and `force-password-change`.
      required:
        [
          id,
          userName,
          displayName,
          admin,
          bootstrapAdmin,
          active,
          locked,
          lockCause,
          hasPassword,
          passwordChangeRequired,
          lastAuthenticatedAt,
          createdAt,
          groups,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The identity's stable SCIM resource id, non-reassignable. The same id
            the SCIM interface serves this identity under, the id the audit trail
            records, and the id every operation on this row addresses.
        userName:
          type: string
          description: The login attribute. Directory-owned, mutable, read-only here.
        displayName:
          type: [string, "null"]
          description: The directory's display name, or null when it sets none.
        admin:
          type: boolean
          description: |
            Whether this identity holds administrative authority. DERIVED from
            direct membership of the server-seeded Admin group, not stored: there
            is no role column, so this reports the same fact the login path
            derives and there is nothing for the two to disagree about.

            Membership changes take effect at the identity's next login. A session
            already issued carries the authority it was issued with.
        bootstrapAdmin:
          type: boolean
          description: |
            Whether this is the deployment's reserved recovery identity. It can
            never be locked, so it has no lockout state to show and nothing to
            Unlock; only it may force its own password change.
        active:
          type: boolean
          description: |
            SCIM's `active` attribute, owned by the directory and read-only here.
            An inactive
            identity is refused at login with the same bare `401` as a wrong
            password.
        locked:
          type: boolean
          description: |
            Whether a lockout is in force. Independent of `active` — a lockout is
            imposed automatically, by a run of failed logins or by the dormancy
            job. It has no expiry and there is no field for one: the lockout stands
            until an administrator calls the unlock operation. Always false for the
            Bootstrap Admin.
        lockCause:
          type: [string, "null"]
          enum: [FAILURES, DORMANCY, null]
          description: |
            Why the lockout was imposed: `FAILURES` when a run of failed logins
            reached the limit, `DORMANCY` when the dormancy job found the identity
            past the lockout window without authenticating. Lets an operator tell a
            forgotten password from an abandoned account before unlocking. `null`
            exactly when `locked` is false. The login refusal is the same bare `401`
            for every cause.
        hasPassword:
          type: boolean
          description: |
            Whether a credential is set at all. A SCIM-provisioned identity may
            exist with no password — it is a supported state, not an incomplete
            one — and such an identity can be read, can be put in a Group, and
            cannot log in. Reported because "no password was ever set" is
            otherwise indistinguishable from "the password is wrong", and only the
            first is fixed by a SCIM write.

            The value itself is never reported, here or anywhere: this schema has
            no field a hash could occupy.
        passwordChangeRequired:
          type: boolean
          description: |
            The change-required flag: whether the identity must replace its
            password before it may do anything but submit that change or log out.
            Set by every connector password write, by `force-password-change` and
            by `unlock` of an identity that has a password; cleared only by a
            successful `POST /api/auth/change-password`.
        lastAuthenticatedAt:
          type: [string, "null"]
          format: date-time
          description: |
            The last successful login made while no password change was required,
            completed self-service change, explicit reactivation or Unlock — the
            dormancy basis; null for an identity that has had none.
            Application-owned; not a SCIM attribute.
        createdAt:
          type: string
          format: date-time
          description: When the SCIM resource was created.
        groups:
          type: array
          description: |
            The Groups this identity is a DIRECT member of, ordered by normalized
            display name. Directory-owned and read-only here, as over SCIM.
          items:
            $ref: "#/components/schemas/DirectGroup"
    DirectGroup:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    GroupSummary:
      type: object
      description: One row of the read-only Groups projection.
      required: [id, displayName, memberCount, adminGroup]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        memberCount:
          type: integer
          minimum: 0
          description: How many Users are direct members.
        adminGroup:
          type: boolean
          description: |
            Whether this is the protected, server-seeded Admin group whose direct
            members hold administrative authority. Decided by the reservation
            marker, never by the name.
    RoleSummary:
      type: object
      description: One Role of the role mapping, read-only.
      required: [name, permissions, groups]
      properties:
        name:
          type: string
          description: The Role's name, unique within the mapping.
        permissions:
          type: array
          description: The Permissions the Role holds, sorted by name, each once.
          items:
            type: string
            enum:
              - audit:read
              - connector:read
              - connector:token
              - connector:write
              - counter:read
              - counter:write
              - group:read
              - group:write
              - ops:read
              - user:read
              - user:write
        groups:
          type: array
          description: |
            The Groups the mapping assigns this Role to, in mapping order; empty for
            a Role no Group confers. A direct member of any of them holds the Role.
          items:
            $ref: "#/components/schemas/MappedGroup"
    MappedGroup:
      type: object
      description: A Group named by the role mapping.
      required: [id, displayName, superuser]
      properties:
        id:
          type: string
          format: uuid
          description: The Group's stable id, as the mapping names it.
        displayName:
          type: [string, "null"]
          description: |
            The directory's current name for the Group, or `null` when no live
            Group has that id: every mapped Group but the Superuser Group may be
            deleted over SCIM, and a deleted one confers nothing.
        superuser:
          type: boolean
          description: |
            Whether this is the Superuser Group — the server-seeded Admin group,
            whose Role holds every Permission, which cannot be renamed or deleted
            and whose Bootstrap Admin membership is frozen.
    UpdateSessionRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ".*\\S.*"
    SessionResponse:
      type: object
      required: [id, createdAt, maxInactiveIntervalSeconds]
      properties:
        id:
          type: string
        displayName:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        maxInactiveIntervalSeconds:
          type: integer
          format: int32
    CountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
          minimum: 0
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
      additionalProperties: true
    AuditEventPage:
      type: object
      required: [events, page, size, totalElements, totalPages]
      properties:
        events:
          type: array
          description: This page's events, newest first.
          items:
            $ref: "#/components/schemas/AuditEvent"
        page:
          type: integer
          description: The zero-based page number asked for.
        size:
          type: integer
          description: The page size asked for.
        totalElements:
          type: integer
          format: int64
          description: Matching events across every page.
        totalPages:
          type: integer
          format: int64
          description: Pages of `size` those events fill; `0` when none match.
    AuditEvent:
      type: object
      description: |
        One recorded event, exactly as stored. There is no property a password,
        bearer value, hash, `userName`, profile value or literal filter value
        could occupy.
      required:
        [
          id,
          occurredAt,
          operation,
          outcome,
          resourceType,
          changedPaths,
          statusClass,
          permissions,
        ]
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
          description: When the audited operation happened, in UTC.
        operation:
          $ref: "#/components/schemas/AuditOperation"
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        actorId:
          type: [string, "null"]
          format: uuid
          description: |
            Who acted, by stable id: an Admin or User for authentication and
            administrative events (including connector and token lifecycle), the
            connector for SCIM events. `null` when nobody was authenticated (a
            refused login, a lockout) or when a scheduled job or startup seeding
            acted — the operation names the job.
        subjectId:
          type: [string, "null"]
          format: uuid
          description: |
            The resource acted on; equal to `resourceId`, except on `ROLE_GRANT`
            and `ROLE_REVOKE`, whose subject is the User whose Role changed and
            whose resource is the mapped Group whose membership moved.
        resourceType:
          type: string
          enum: [User, Group, ScimConnector, "User,Group"]
          description: |
            `ScimConnector` for connector and token lifecycle events, named by the
            connector's id rather than the token's; `User,Group` for a base
            `/.search`.
        resourceId:
          type: [string, "null"]
          format: uuid
          description: |
            Stable id of the resource acted on. `null` when the operation named no
            existing resource — a login for an unknown `userName`, a refused
            create, a bulk read.
        changedPaths:
          type: array
          items:
            type: string
          description: Attribute paths the operation changed, never their values; empty when none.
        statusClass:
          type: string
          enum: [ok, client_error, server_error]
        errorCode:
          type: [string, "null"]
          description: |
            A refusal reason from the service's own closed set (e.g.
            `BAD_CREDENTIALS`), never a message. On a `LOCKOUT_LIFT`, the cause of
            the lock it lifted (`FAILURES` or `DORMANCY`).
        httpMethod:
          type: [string, "null"]
        httpPath:
          type: [string, "null"]
          description: The matched route template, never the resolved path.
        requestId:
          type: [string, "null"]
          description: Correlation id of the triggering request, shared with its log lines.
        resultCount:
          type: [integer, "null"]
          description: How many resources a bulk read returned; `null` for every other operation.
        filterShape:
          type: [string, "null"]
          description: |
            A bulk read's filter with every literal replaced by `?`
            (`userName eq ?`); `null` when it had none or is not a bulk read.
        role:
          type: [string, "null"]
          description: |
            The Role a `ROLE_GRANT` or `ROLE_REVOKE` gained or lost, by its name in
            the deployment's role mapping when the change happened — or, on a
            `DORMANCY_ROLE_REVOCATION`, every Role lost, sorted and comma-joined;
            `null` for every other operation.
        permissions:
          type: array
          items:
            type: string
          description: |
            The Permissions a `CONNECTOR_TOKEN_ISSUE` or `CONNECTOR_TOKEN_ROTATE`
            granted the new token or — on a `FAILURE` with `errorCode`
            `PERMISSION_ESCALATION` — that were asked for, sorted by name; empty
            for every other event.
        loginMethod:
          type: [string, "null"]
          enum: [password, sso, null]
          description: |
            How a `LOGIN_SUCCESS` or `LOGIN_FAILURE` was attempted: `password`
            for password Login, `sso` for an EHR launch from Epic (Epic Login,
            D15; one Epic organisation per deployment, so `sso` means Epic).
            `null` for every other operation, and for a login recorded before
            the method was.
    AuditOutcome:
      type: string
      enum: [SUCCESS, FAILURE]
      description: Whether the audited operation worked — not whether recording it did.
    AuditOperation:
      type: string
      enum:
        - LOGIN_SUCCESS
        - LOGIN_FAILURE
        - LOGOUT
        - LOCKOUT_SET
        - LOCKOUT_LIFT
        - ACCOUNT_DISABLE
        - ACCOUNT_ENABLE
        - CONNECTOR_CREATE
        - CONNECTOR_DELETE
        - CONNECTOR_TOKEN_ISSUE
        - CONNECTOR_TOKEN_ROTATE
        - CONNECTOR_TOKEN_REVOKE
        - SCIM_USER_CREATE
        - SCIM_USER_LIST
        - SCIM_USER_REPLACE
        - SCIM_USER_DELETE
        - USER_SESSIONS_REVOKE
        - SCIM_GROUP_CREATE
        - SCIM_GROUP_REPLACE
        - SCIM_GROUP_DELETE
        - SCIM_GROUP_LIST
        - SCIM_RESOURCE_LIST
        - SCIM_RESOURCE_SEED
        - DORMANCY_LOCKOUT
        - DORMANCY_ROLE_REVOCATION
        - PASSWORD_CHANGE_REQUIRE
        - PASSWORD_CHANGE
        - ACCESS_DENIED
        - ROLE_GRANT
        - ROLE_REVOKE
      description: |
        What happened, as a closed set. `LOCKOUT_LIFT` is always an Admin's Unlock:
        a lockout has no duration, so there is no expiry lift; its `errorCode` is
        the cause of the lock it lifted (`FAILURES` or `DORMANCY`), or `null` when
        the User was not locked. `DORMANCY_LOCKOUT` and `DORMANCY_ROLE_REVOCATION`
        are the dormancy job's, with no actor: the first locked the User, the
        second removed its direct membership of every mapped Group and names the
        Roles lost in `role`, comma-joined. `ACCESS_DENIED` is an
        authorization refusal on the application chain: the refused User as actor
        and subject, the operation as `httpMethod` and `httpPath` (the route
        template, `unmatched` for a route nothing declares) and the one generic
        `errorCode` `INSUFFICIENT_PERMISSIONS` — never the Permission, Role or rule
        that refused, which the operation's own `security` declaration names. On
        the SCIM chain the same event names the refused token's CONNECTOR as actor,
        subject and resource (`resourceType` `ScimConnector`).
        `ROLE_GRANT` and `ROLE_REVOKE` are a change of power through a mapped
        Group's membership — a connector adding a User to the Group, or removing
        it by `PATCH`, `PUT` or the Group's `DELETE` — with the connector as
        actor, the User as subject, the Group as resource and the Role as `role`.
    ConnectorTokenPermissions:
      type: array
      minItems: 1
      items:
        type: string
        enum: [user:read, user:write, group:read, group:write]
      description: |
        What the token may do over SCIM, from the same Permission vocabulary a
        User's Roles grant (ADR 0010): `user:read` for Users reads, `user:write`
        for Users `POST`/`PUT`/`PATCH`/`DELETE`, `group:read` / `group:write`
        likewise for Groups. Write does NOT imply read. Only these four can be
        carried by a token; any other Permission, an unknown name or an empty list
        is `400`. On issue and rotation each one must also be held by the calling
        administrator — a token can never be more powerful than whoever minted it;
        asking for more is `403`, audited with the Permissions requested. Returned
        sorted by name. Enforced in the SCIM chain's filter from the method and
        path alone, before any handler runs.
    CreateConnectorRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: The administrator's own label. Carries no authority.
    IssueTokenRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          $ref: "#/components/schemas/ConnectorTokenPermissions"
        lifetimeDays:
          type: [integer, "null"]
          format: int32
          minimum: 1
          maximum: 365
          description: Defaults to 365, which is also the hard maximum.
    RotateTokenRequest:
      type: object
      properties:
        overlapDays:
          type: [integer, "null"]
          format: int32
          description: |
            How long the old token keeps working. Clamped to 14 days and to the life
            the old token had left; absent or zero ends it immediately.
        permissions:
          description: |
            The replacement's Permissions, on the terms an issue's are. Absent or
            `null` keeps the old token's — which are then checked against the
            caller's own, exactly as a requested set is.
          oneOf:
            - $ref: "#/components/schemas/ConnectorTokenPermissions"
            - type: "null"
    ConnectorTokenSummary:
      type: object
      required:
        [id, permissions, issuedAt, expiresAt, originalExpiresAt, active]
      description: |
        Has no property a token value or its hash could occupy, and that is
        deliberate: the serialised projection has no such field, so a listing cannot
        disclose a credential even by mistake.
      properties:
        id:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
            enum: [user:read, user:write, group:read, group:write]
          description: |
            What the token may do, sorted by name. Empty only for a token stored
            before tokens carried Permissions, which may read discovery and nothing
            else.
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: As it currently stands; a rotation may have brought it forward.
        originalExpiresAt:
          type: string
          format: date-time
          description: |
            The expiry it was issued with, so a shortened overlap window is visible
            as one. Never earlier than `expiresAt`.
        revokedAt:
          type: [string, "null"]
          format: date-time
        active:
          type: boolean
          description: |
            Whether the token would be accepted right now — the server's own
            evaluation, not a comparison the client makes against its own clock.
    ConnectorSummary:
      type: object
      required: [id, displayName, createdAt, tokens]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        tokens:
          type: array
          description: Every token the connector has held, newest issue first.
          items:
            $ref: "#/components/schemas/ConnectorTokenSummary"
    IssuedConnectorToken:
      type: object
      required:
        [connectorId, tokenId, permissions, issuedAt, expiresAt, presentedValue]
      description: |
        The only schema that carries a token value, returned only by issue and
        rotate. A type of its own rather than a nullable field on
        `ConnectorTokenSummary`, so the shape a listing uses has no property for a
        credential at all.
      properties:
        connectorId:
          type: string
          format: uuid
        tokenId:
          type: string
          format: uuid
        permissions:
          $ref: "#/components/schemas/ConnectorTokenPermissions"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        presentedValue:
          type: string
          description: |
            The complete opaque bearer value, sent to the SCIM interface as
            `Authorization: Bearer <value>`. Store it now — this service holds only
            a digest and cannot show it again.
    ScimError:
      type: object
      required: [schemas, status, detail]
      description: |
        The one shape every SCIM refusal from this namespace takes. `status` is a
        STRING, as RFC 7644 §3.12 defines it. `scimType` is present only where the RFC
        defines one for the condition, and is omitted rather than null where it does
        not. `detail` is written by this service and never echoes a submitted value —
        an attribute path, yes; a userName or a password, never. A server-side fault
        is the same document with `status` `"500"` and no `scimType`.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:Error"]
        status:
          type: string
          example: "409"
        scimType:
          type: string
          enum:
            [
              invalidSyntax,
              invalidValue,
              invalidFilter,
              invalidPath,
              noTarget,
              mutability,
              uniqueness,
            ]
        detail:
          type: string
    ScimMeta:
      type: object
      description: |
        Server-owned metadata. Timestamps are UTC with a `Z` offset, as RFC 7643's
        conventions lead a connector to expect; the service's log timestamps use a
        different zone and the two are not reconciled.
      properties:
        resourceType:
          type: string
          example: User
        created:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        location:
          type: string
          format: uri
          pattern: "^https?://"
          description: |
            The absolute URI the resource is served at (RFC 7643 §3.1), built from the
            scheme, host and port the request arrived on. Absolute on every SCIM resource —
            Users, Groups and the discovery documents (`ServiceProviderConfig`, each
            `ResourceType`, each `Schema`) alike, in list and by-id responses. The
            pattern makes the contract check refuse a relative value.
          example: https://idp.example.com/scim/v2/Users/2819c223-7f76-453a-919d-413861904646
        version:
          type: string
          description: |
            The resource's strong validator, quotes included — the same string as the
            `ETag` header, so a client can compare the two without unwrapping either.
          example: '"1"'
    ScimUserName:
      type: object
      description: |
        The `name` complex attribute. Every sub-attribute is optional, and the
        attribute is omitted entirely when all of them are absent — SCIM omits an
        unassigned attribute rather than rendering an empty object. Each is at most
        256 characters.
      properties:
        formatted:
          type: string
          maxLength: 256
        familyName:
          type: string
          maxLength: 256
        givenName:
          type: string
          maxLength: 256
        middleName:
          type: string
          maxLength: 256
        honorificPrefix:
          type: string
          maxLength: 256
        honorificSuffix:
          type: string
          maxLength: 256
    ScimUserEmail:
      type: object
      required: [value]
      description: |
        One value of the multi-valued `emails` attribute. `(type, value)` duplicates
        are removed before storage and at most one value may be primary — a second
        claim is demoted rather than refused. `primary` is rendered only when true.
      properties:
        value:
          type: string
          maxLength: 256
        type:
          type: string
          maxLength: 32
          example: work
        primary:
          type: boolean
    ScimUser:
      type: object
      required: [schemas]
      description: |
        A SCIM core User, as this service implements it. Unimplemented core attributes
        and every extension are absent from `/Schemas` and refused when asserted on a
        write.

        `userName` is required on every write, and present on every read except one
        whose `attributes`/`excludedAttributes` projection leaves it out — so it is
        not listed as `required` here, where one schema serves both directions.

        On a write: `id`, `meta` and `groups` are ignored if present, `password` is
        write-only and never returned, and `externalId` is scoped to the calling
        connector. On a read: `password` is never present, and an unassigned attribute
        is omitted rather than rendered null.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:schemas:core:2.0:User"]
        id:
          type: string
          format: uuid
          description: Server-assigned, stable, and unique across Users and Groups.
          readOnly: true
        externalId:
          type: string
          maxLength: 256
          description: The calling connector's alias for this resource, case-exact.
        userName:
          type: string
          maxLength: 256
          description: |
            Unique among live Users, case-insensitively, after Unicode NFKC and case
            folding. Mutable, and reusable once its User is deleted. At most 256
            characters both as sent and after normalization, which can lengthen it.
        name:
          $ref: "#/components/schemas/ScimUserName"
        displayName:
          type: string
          maxLength: 256
        preferredLanguage:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 64
        timezone:
          type: string
          maxLength: 64
        active:
          type: boolean
          description: Defaults to true on create. An inactive User cannot log in.
        password:
          type: string
          writeOnly: true
          description: |
            Hashed with Argon2id before the resource is persisted, and never returned,
            logged or audited as a value. Optional: a User created without one exists
            and cannot authenticate until one is set.
        emails:
          type: array
          items:
            $ref: "#/components/schemas/ScimUserEmail"
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimGroup:
      type: object
      required: [schemas]
      description: |
        A SCIM core Group, as this service implements it: a label and a direct-User
        membership, and nothing else. What a Group is FOR here is conferring
        authority, so no other attribute would change who may do what.

        `displayName` is required on every write and present on every read that does
        not project it away, as `userName` is for a User.

        On a write: `id` and `meta` are ignored if present, `externalId` is scoped to
        the calling connector and is discarded on a PUT, and every `members`
        sub-attribute other than `value` is read-only and ignored. On a read: an
        unassigned attribute is omitted rather than rendered null, so an empty Group
        renders no `members` at all.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:schemas:core:2.0:Group"]
        id:
          type: string
          format: uuid
          description: Server-assigned, stable, and unique across Users and Groups.
          readOnly: true
        externalId:
          type: string
          maxLength: 256
          description: The calling connector's alias for this resource, case-exact.
        displayName:
          type: string
          maxLength: 256
          description: |
            Unique among live Groups, case-insensitively, after Unicode NFKC and case
            folding — stricter than RFC 7643, which leaves it non-unique. At most 256
            characters both as sent and after normalization. Made unique
            because a Group's membership confers authority, and two Groups an
            administrator reads as the same name is how membership of the wrong one
            gets granted.

            The Admin group's name cannot be changed. Its authority is carried by its
            stable id rather than by this string, so the immutability is not about the
            name mattering — it is that a renameable recovery resource is one a
            connector can make unrecognisable to an administrator reading the
            directory.
        members:
          type: array
          description: |
            Direct User members. A member id naming a Group, a deleted User, or nothing
            at all is one indistinguishable `400 invalidValue`. Nested and transitive
            membership are unsupported and have no representation.
          items:
            $ref: "#/components/schemas/ScimGroupMember"
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimGroupMember:
      type: object
      required: [value]
      description: |
        One membership. `value` is the only sub-attribute a write supplies; the rest are
        read-only and derived from the referenced User, so a submitted value is ignored
        rather than stored — there is no column it could be written to.
      properties:
        value:
          type: string
          format: uuid
          description: The member User's stable SCIM id.
        display:
          type: string
          description: |
            The referenced User's `displayName`, or its `userName` when it has none.
            Read-only.
          readOnly: true
        $ref:
          type: string
          description: |
            Absolute URI of the referenced User, built from its id rather than stored —
            a stored reference would be wrong the moment the service moved. Read-only.
          readOnly: true
        type:
          type: string
          description: Always `User`; this directory has no Group-valued members.
          readOnly: true
          enum: [User]
    ScimPatchOp:
      type: object
      required: [schemas, Operations]
      description: |
        A SCIM PATCH request. Operations apply in the order given, and the whole
        sequence is folded into one desired state and written once — so a sequence
        whose later operation is refused applies none of the earlier ones.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
        Operations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ScimPatchOperation"
    ScimPatchOperation:
      type: object
      required: [op, path]
      description: |
        One operation. `path` is REQUIRED by this service: a path-less `add` would be an
        attribute-by-attribute merge whose semantics for a multi-valued attribute RFC
        7644 leaves genuinely ambiguous, and guessing at it is worse than refusing.
      properties:
        op:
          type: string
          description: Matched case-insensitively, as RFC 7644 §3.5.2 requires.
          enum: [add, replace, remove]
        path:
          type: string
          description: |
            `displayName`, `members`, or `members[value eq "<uuid>"]` — the only
            value-path form accepted, and only with `remove`. Any other path is
            `400 invalidPath`.
          example: members
        value:
          description: |
            A string for `displayName`; an array of member objects for `members`.
            Omitted on a `remove` that clears the whole membership.
    ScimListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage]
      description: |
        A SCIM collection. `totalResults` counts every matching resource and not the
        page; `itemsPerPage` is the size of the page actually returned. `Resources` is
        omitted entirely when empty, including for `count=0`.
      properties:
        schemas:
          type: array
          items:
            type: string
          example: ["urn:ietf:params:scim:api:messages:2.0:ListResponse"]
        totalResults:
          type: integer
        startIndex:
          type: integer
        itemsPerPage:
          type: integer
        Resources:
          type: array
          items:
            $ref: "#/components/schemas/ScimAnyResource"
    ScimAnyResource:
      type: object
      description: |
        A SCIM resource whose own schema varies by endpoint — a listed User, Group,
        ResourceType or Schema, or a discovery document read by id. Typed only by its
        server-owned `meta`, which is enough for the contract check to hold every
        `meta.location` to the same absolute form, in list and by-id responses alike.
      properties:
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimSearchRequest:
      type: object
      required: [schemas]
      description: |
        RFC 7644 §3.4.3. Member names are matched case-insensitively; no other member is
        accepted. The values mean exactly what the query parameters of the same names
        mean on a collection `GET`.
      additionalProperties: false
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: ["urn:ietf:params:scim:api:messages:2.0:SearchRequest"]
        filter:
          type: string
          maxLength: 8192
        sortBy:
          type: string
        sortOrder:
          type: string
          enum: [ascending, descending]
        startIndex:
          type: integer
        count:
          type: integer
        attributes:
          type: array
          items:
            type: string
        excludedAttributes:
          type: array
          items:
            type: string
      example:
        schemas: ["urn:ietf:params:scim:api:messages:2.0:SearchRequest"]
        filter: 'userName eq "bjensen" and emails[type eq "work"]'
        sortBy: name.familyName
        startIndex: 1
        count: 50
        attributes: [userName, emails]
    ScimServiceProviderConfig:
      type: object
      description: |
        What this deployment implements. Each flag is asserted in the test suite beside
        the behaviour it advertises, so the document cannot drift from the service.
      properties:
        schemas:
          type: array
          items:
            type: string
        patch:
          $ref: "#/components/schemas/ScimSupportedFlag"
        bulk:
          type: object
          description: Unsupported permanently, with zero limits.
          properties:
            supported:
              type: boolean
            maxOperations:
              type: integer
            maxPayloadSize:
              type: integer
        filter:
          type: object
          properties:
            supported:
              type: boolean
            maxResults:
              type: integer
              description: The page ceiling every collection response obeys.
        changePassword:
          $ref: "#/components/schemas/ScimSupportedFlag"
        sort:
          $ref: "#/components/schemas/ScimSupportedFlag"
        etag:
          $ref: "#/components/schemas/ScimSupportedFlag"
        authenticationSchemes:
          type: array
          description: Exactly one entry, of type `oauthbearertoken`.
          items:
            type: object
        meta:
          $ref: "#/components/schemas/ScimMeta"
    ScimSupportedFlag:
      type: object
      properties:
        supported:
          type: boolean
