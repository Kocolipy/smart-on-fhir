# Local Semgrep ruleset, run by `./scripts/semgrep.sh` alongside the registry
# packs.
#
# Local, not a registry pack, for two reasons: the run stays offline and
# deterministic, and each rule here can carry the reason this project cares
# about it. The registry packs the script also passes cover the generic Java and
# OWASP ground; this file covers the decisions that are specific to THIS
# service, where a regression would pass a generic scan.
#
# Rule ids are prefixed `be-` so they never collide with a registry id.
rules:
  - id: be-csrf-disabled
    languages: [java]
    severity: ERROR
    message: >-
      CSRF protection is being disabled. The SPA contract (frontend/AGENTS.md,
      "Backend contract") is a session-bound synchronizer token: the SPA fetches
      it from GET /api/auth/csrf and echoes it in the header that endpoint names
      on every unsafe request. Disabling the filter makes every one of those
      requests succeed without the token, so the contract silently stops being
      enforced and the frontend tests still pass.
    pattern-either:
      - pattern: $HTTP.csrf($C -> $C.disable())
      - pattern: $HTTP.csrf(AbstractHttpConfigurer::disable)
      - pattern: $HTTP.csrf($C -> $C.ignoringRequestMatchers(...))

  - id: be-csrf-cookie-token
    languages: [java]
    severity: ERROR
    message: >-
      A cookie-borne CSRF token is coming back. The standard prohibits
      cookie-based CSRF outright (docs/adr/0009-csrf-synchronizer-token.md): the
      token must live in the HTTP session (HttpSessionCsrfTokenRepository), be
      XOR-masked by the default request handler, and reach the SPA only in the
      body of GET /api/auth/csrf. CookieCsrfTokenRepository writes an
      XSRF-TOKEN cookie, and csrf.spa() installs that repository together with
      a handler that accepts the unmasked token.
    pattern-either:
      - pattern: CookieCsrfTokenRepository.$FACTORY(...)
      - pattern: new CookieCsrfTokenRepository(...)
      - pattern: new SpaCsrfTokenRequestHandler(...)
      - pattern: $C.spa()

  - id: be-authorize-any-request-permit-all
    languages: [java]
    severity: ERROR
    message: >-
      `anyRequest().permitAll()` makes the default-deny tail of the filter chain
      a default-allow. This chain's contract is `anyRequest().authenticated()`
      with an explicit permitAll allowlist for the login endpoint, the health
      probe and frontend GETs. Add to that allowlist instead of inverting the
      default.
    pattern-either:
      - pattern: $A.anyRequest().permitAll()
      - pattern: $A.anyRequest().denyAll().permitAll()

  - id: be-session-fixation-disabled
    languages: [java]
    severity: ERROR
    message: >-
      Session fixation protection is being turned off. AuthController rotates
      the session id through the ChangeSessionIdAuthenticationStrategy bean
      precisely because nothing in the filter chain authenticates, so a
      pre-login session id would otherwise survive authentication and be
      replayable.
    pattern-either:
      - pattern: $S.sessionFixation($F -> $F.none())
      - pattern: $S.sessionFixation($F -> $F.migrateSession().none())

  - id: be-insecure-password-encoder
    languages: [java]
    severity: ERROR
    message: >-
      Passwords must stay behind BCryptPasswordEncoder. NoOp stores the
      plaintext and the message-digest encoders are unsalted and fast, so a
      leaked store is trivially reversible.
    pattern-either:
      - pattern: NoOpPasswordEncoder.getInstance()
      - pattern: new StandardPasswordEncoder(...)
      - pattern: new MessageDigestPasswordEncoder(...)
      - pattern: NoOpPasswordEncoder.getInstance().encode(...)

  - id: be-hardcoded-credential-literal
    languages: [java]
    severity: ERROR
    message: >-
      A credential is being built from a string literal. This remote is public.
      Credentials reach the service as environment variables read through
      @Value, never as source. If this is test data, it belongs in
      src/test/resources/application.yaml with the rest of it.
    patterns:
      - pattern-either:
          - pattern: User.withUsername(...).password("...")
          - pattern: $B.password("...")
          - pattern: $B.secret("...")
      - pattern-not-inside: |
          @SpringBootTest
          class $C { ... }

  - id: be-jpql-string-concatenation
    languages: [java]
    severity: ERROR
    message: >-
      A query is being assembled by string concatenation, which is an injection
      sink the moment any fragment is caller-controlled. Use a bound parameter
      (:name or ?1) — every repository in this service already does.
    pattern-either:
      - pattern: |
          @Query("..." + $X)
      - pattern: $EM.createQuery("..." + $X)
      - pattern: $EM.createNativeQuery("..." + $X)
      - pattern: $JDBC.queryForObject("..." + $X, ...)
      - pattern: $JDBC.query("..." + $X, ...)

  - id: be-cors-wildcard-origin
    languages: [java]
    severity: ERROR
    message: >-
      The SPA is served from this same origin, so the service needs no CORS
      allowance at all. A wildcard origin combined with the session cookie this
      service issues would let any site drive an authenticated request.
    pattern-either:
      - pattern: $C.allowedOrigins("*")
      - pattern: $C.allowedOriginPatterns("*")
      - pattern: $C.addAllowedOrigin("*")
      - pattern: |
          @CrossOrigin(origins = "*")

  - id: be-process-execution
    languages: [java]
    severity: ERROR
    message: >-
      This service has no reason to spawn a process. Any argument reaching exec()
      from a request is command injection, and the container image has no shell
      contract to rely on.
    pattern-either:
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: new ProcessBuilder(...)

  - id: be-java-deserialization
    languages: [java]
    severity: ERROR
    message: >-
      Java deserialization of untrusted bytes executes attacker-chosen code
      during readObject. Session state is serialized by Spring Session into
      Redis, which is trusted infrastructure; application code should use JSON.
    pattern-either:
      - pattern: new ObjectInputStream(...).readObject()
      - pattern: $OIS.readObject()

  - id: be-trust-all-certificates
    languages: [java]
    severity: ERROR
    message: >-
      A TrustManager that accepts every certificate, or a hostname verifier that
      returns true, removes the only thing that makes TLS more than encryption
      to an unknown peer.
    pattern-either:
      - pattern: |
          public void checkServerTrusted(...) { }
      - pattern: |
          public boolean verify(...) { return true; }
      - pattern: $B.setSSLHostnameVerifier(NoopHostnameVerifier.INSTANCE)

  # ---------------------------------------------------------------------------
  # Log redaction. The three rules below are one requirement: a log record's
  # variable parts are named structured fields carrying ids, and a userName,
  # filter expression, password, bearer value, hash or cookie value never reaches
  # a record at all. A log store is read by more people, retained longer, and
  # shipped further than the database the value came from, so a leak there is
  # wider than the one it was copied from.
  #
  # Checked statically rather than only by test because the property is about
  # every call site at once: a test can only assert about the flows it drives, and
  # the leak that matters is the log line someone adds next year in a flow no test
  # covers. See /docs/adr/0003-ecs-structured-logging-with-redaction.md.
  # ---------------------------------------------------------------------------

  - id: be-log-message-concatenation
    languages: [java]
    severity: ERROR
    message: >-
      A value is being concatenated into a log message. Two things break at once:
      the value stops being a queryable field and becomes text inside a sentence,
      and a value carrying a newline can end this record and forge the next one
      (CWE-117). Emit it as a structured field instead —
      log.atInfo().addKeyValue("event.action", action).log("...") — with a
      constant message, and only after confirming the value is not one this
      service refuses to log at all.
    patterns:
      - pattern-either:
          - pattern: $LOG.trace($A + $B, ...)
          - pattern: $LOG.debug($A + $B, ...)
          - pattern: $LOG.info($A + $B, ...)
          - pattern: $LOG.warn($A + $B, ...)
          - pattern: $LOG.error($A + $B, ...)
          - pattern: $LOG.log($A + $B, ...)
          - pattern: $LOG.setMessage($A + $B, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i).*log.*

  - id: be-log-sensitive-value
    languages: [java]
    severity: ERROR
    message: >-
      A value whose name says it is an identifier or a secret is being passed to a
      logging call. None of these belong in a log record — not as a {} parameter,
      not as a structured field, not in the logging context. Correlate by stable
      id instead (LogContext's four keys), and let the audit trail, not the log
      stream, be what names a subject.
    patterns:
      - pattern-either:
          - pattern: $LOG.trace(..., $VALUE, ...)
          - pattern: $LOG.debug(..., $VALUE, ...)
          - pattern: $LOG.info(..., $VALUE, ...)
          - pattern: $LOG.warn(..., $VALUE, ...)
          - pattern: $LOG.error(..., $VALUE, ...)
          - pattern: $LOG.log(..., $VALUE, ...)
          - pattern: $LOG.addKeyValue(..., $VALUE, ...)
          - pattern: $LOG.setMessage(..., $VALUE, ...)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i).*log.*
      # Two families of name, either of which refuses the call.
      #
      # The first matches anywhere in the argument, so `newPassword` and `token.value()` are
      # caught along with the bare names. It already covers Epic Login's `id_token` and
      # `access_token`, both being tokens.
      #
      # The second is the rest of Epic Login's never-logged values (ADR 0013, D22): the
      # authorization `code`, `state`, `nonce`, `launch`, the PKCE verifier, the client
      # assertion, and the private key material of the signing keys `APP_EPIC_CLIENT_KEY`
      # and `APP_EPIC_CLIENT_NEXT_KEY`. They are matched as a whole identifier — a segment
      # of the argument between characters that cannot be part of a Java name or a
      # kebab-case property — because `code` and `state` are also the tail of names that
      # are fine to log: `statusCode`, `ERROR_CODE`, `stateRule`. The keys' `kid`s
      # (`clientKeyId`, `APP_EPIC_CLIENT_KEY_ID`) are deliberately outside it: a `kid` is
      # public, published in our JWKS, and the startup record logs both by design (D14).
      # This is the second line of defence; the first is that no code path hands any of
      # these values to a logging call at all.
      - metavariable-regex:
          metavariable: $VALUE
          regex: "(?is)(.*(user_?name|password|passwd|credential|secret|bearer|token|hash|cookie|filter).*|(.*[^a-z0-9_$-])?(code|auth(orization)?_?code|state|nonce|launch|(pkce_?|code_?)?verifier|(client_?)?assertion|private_?key|pem|client[_-]?(next[_-]?)?key|app_epic_client_(next_)?key)([^a-z0-9_$-]|$))"

  - id: be-mdc-direct-access
    languages: [java]
    severity: ERROR
    message: >-
      The logging context is written through
      com.example.backend.observability.LogContext and nowhere else. It exposes
      five named setters — request id, user id, connector id, resource id, and a
      scheduled job run's identity — and no
      general-purpose one, which is what makes "the permitted keys are the only
      keys" true of the whole service rather than of the call sites someone
      happened to review. ArchitectureTest holds the same line.
    paths:
      exclude:
        # The class that owns the contract, and the test that holds it to leaving
        # a key it does not own alone — which it can only assert by putting one
        # there itself.
        - "**/LogContext.java"
        - "**/LogContextTests.java"
    pattern-either:
      - pattern: MDC.put(...)
      - pattern: MDC.putCloseable(...)
      - pattern: MDC.setContextMap(...)
      - pattern: org.slf4j.MDC.put(...)
      - pattern: org.slf4j.MDC.putCloseable(...)
      - pattern: org.slf4j.MDC.setContextMap(...)

  # event.action takes its value from the logging standard's closed enum, and the
  # one place that maps this service's operations onto it is LogEvent.Operation.
  # A record that wrote the key itself could put any string there — the local names
  # this rule replaced, say — and a log search on the standard's value would then
  # silently miss it. So the key is written by LogEvent.classify alone, under
  # either spelling of its name, and the same goes for the local-name key beside it.
  # The match is on the key expression as written: a key computed into a local
  # variable first would not match. Nothing in the service builds keys that way —
  # every key is a LogEvent or LogContext constant — and review owns that residue.
  - id: be-log-event-action-outside-the-vocabulary
    languages: [java]
    severity: ERROR
    message: >-
      event.action and app.event.action are written by LogEvent.classify(...) and
      nowhere else, from a LogEvent.Operation. Classify the record with an
      Operation — adding one, mapped onto Log_Schema.md §Event, if none fits — and
      record the mapping in docs/adr/0003. A free-text action here is invisible to
      a search on the standard's value.
    paths:
      exclude:
        - "**/LogEvent.java"
    pattern-either:
      - pattern: $RECORD.addKeyValue(LogEvent.ACTION, ...)
      - pattern: $RECORD.addKeyValue(LogEvent.LOCAL_ACTION, ...)
      - pattern: $RECORD.addKeyValue(com.example.backend.observability.LogEvent.ACTION, ...)
      - pattern: $RECORD.addKeyValue(com.example.backend.observability.LogEvent.LOCAL_ACTION, ...)
      - pattern: $RECORD.addKeyValue("event.action", ...)
      - pattern: $RECORD.addKeyValue("app.event.action", ...)
      - pattern: $RECORD.addKeyValue(ACTION, ...)
      - pattern: $RECORD.addKeyValue(LOCAL_ACTION, ...)

  # Every ERROR record carries Log_Schema.md §Error's error.code, error.category and
  # error.follow_up_action — the fields a platform alert on this service's errors
  # selects on. LogEvent's ERROR shapes (error, jobFailed, and requestEnd for an unrecorded
  # 5xx) are the only way to open an ERROR record, and each writes all three, so a record that
  # skipped them would have
  # to open itself some other way: atError() on the logger, the classic error(...)
  # methods, or atLevel(...), which can reach ERROR from a computed level. All three
  # are therefore refused outside LogEvent. Tests are excluded: they emit records to
  # exercise the capture, not to report a fault.
  - id: be-log-error-without-error-fields
    languages: [java]
    severity: ERROR
    message: >-
      Open an ERROR record with LogEvent.error(log, operation, code, category, ...) — or the
      scheduled-run and request shapes, LogEvent.jobFailed / requestEnd — so it carries
      error.code, error.category and error.follow_up_action (Log_Schema.md §Error). A record
      opened with atError(), error(...) or atLevel(...) here would reach the stream
      unclassified, and an alert written against the schema would not see it. For a level
      chosen at run time, branch between LogEvent's shapes.
    paths:
      exclude:
        - "**/LogEvent.java"
        - "**/src/test/**"
    pattern-either:
      - pattern: (Logger $LOG).atError()
      - pattern: (Logger $LOG).error(...)
      - pattern: (Logger $LOG).atLevel(...)
      - pattern: (org.slf4j.Logger $LOG).atError()
      - pattern: (org.slf4j.Logger $LOG).error(...)
      - pattern: (org.slf4j.Logger $LOG).atLevel(...)

  # A record's outcome, its duration and its message are the record shape's, not the call
  # site's: LogEvent.success / refused / error, the scheduled-run shapes and requestEnd each
  # open the record at its level, set event.outcome and event.duration_ms where the shape has
  # them, and set the operation's fixed message. A caller adds only the ids and counts it alone
  # can supply and calls log(). So outside LogEvent no production code opens a record on a
  # logger at any level (ERROR is be-log-error-without-error-fields'), writes either key, sets
  # a message, or passes one to log(...) — which is what lets one standard field be added to
  # every record of a shape in one file (#128, ADR 0003). The match on log(...) and setMessage
  # is by name, as be-log-sensitive-value's is: nothing else in the service has a log method
  # taking arguments.
  - id: be-log-record-outside-log-event
    languages: [java]
    severity: ERROR
    message: >-
      Build the record with a LogEvent shape — success, refused, error, jobScheduled, jobStart,
      jobEnd, jobFailed, jobSummary or requestEnd — and end it with log(). The shape sets the
      level, event.outcome, event.duration_ms and the operation's fixed message; a call site
      setting any of them by hand is the drift this rule exists to stop. If no shape fits, add
      one to LogEvent and record it in docs/adr/0003.
    paths:
      exclude:
        - "**/LogEvent.java"
        - "**/src/test/**"
    patterns:
      - pattern-either:
          - pattern: (Logger $LOG).atInfo()
          - pattern: (Logger $LOG).atWarn()
          - pattern: (Logger $LOG).atDebug()
          - pattern: (Logger $LOG).atTrace()
          - pattern: (Logger $LOG).info(...)
          - pattern: (Logger $LOG).warn(...)
          - pattern: (Logger $LOG).debug(...)
          - pattern: (Logger $LOG).trace(...)
          - pattern: (org.slf4j.Logger $LOG).atInfo()
          - pattern: (org.slf4j.Logger $LOG).atWarn()
          - pattern: (org.slf4j.Logger $LOG).atDebug()
          - pattern: (org.slf4j.Logger $LOG).atTrace()
          - pattern: (org.slf4j.Logger $LOG).info(...)
          - pattern: (org.slf4j.Logger $LOG).warn(...)
          - pattern: (org.slf4j.Logger $LOG).debug(...)
          - pattern: (org.slf4j.Logger $LOG).trace(...)
          - pattern: $RECORD.addKeyValue(LogEvent.OUTCOME, ...)
          - pattern: $RECORD.addKeyValue(LogEvent.DURATION_MS, ...)
          - pattern: $RECORD.addKeyValue(com.example.backend.observability.LogEvent.OUTCOME, ...)
          - pattern: $RECORD.addKeyValue(com.example.backend.observability.LogEvent.DURATION_MS, ...)
          - pattern: $RECORD.addKeyValue("event.outcome", ...)
          - pattern: $RECORD.addKeyValue("event.duration_ms", ...)
          - pattern: $RECORD.addKeyValue(OUTCOME, ...)
          - pattern: $RECORD.addKeyValue(DURATION_MS, ...)
          - pattern: $RECORD.setMessage(...)
          - pattern: $RECORD.log($MESSAGE, ...)
      - pattern-not: Math.log(...)
      - pattern-not: StrictMath.log(...)

  # ---------------------------------------------------------------------------
  # Audit trail redaction and the append-only arrangement. The audit trail is read
  # by an administrator investigating account activity and is retained for a year,
  # so a readable identifier written into an event body outlives every other copy
  # of it. Two rules, for the two ways that could happen.
  #
  # The structural half of this is a signature: no method on
  # com.example.backend.audit.domain.AuditTrail declares a String parameter, so a
  # username, password or bearer value cannot be handed to it at all, and
  # ArchitectureTest.the_audit_trail_boundary_admits_no_free_text holds that. These
  # rules cover what a signature cannot — a value reaching the boundary through a
  # method someone adds, and the retention role being assumed somewhere new.
  # ---------------------------------------------------------------------------

  - id: be-audit-sensitive-value
    languages: [java]
    severity: ERROR
    message: >-
      A value whose name says it is a credential or a readable identifier is being
      passed to the audit trail. An audit event names an actor and a subject by the
      account's stable id and nothing else — no userName, no password, no bearer
      value, no hash, not even in a reason or a detail field. Resolve the stable id
      and pass that; if the id cannot be resolved, record no subject rather than
      the name, which is what AuditTrail.recordLoginFailure(null, ...) is for.
    patterns:
      - pattern-either:
          - pattern: $AUDIT.recordLoginSuccess(..., $VALUE, ...)
          - pattern: $AUDIT.recordLoginFailure(..., $VALUE, ...)
          - pattern: $AUDIT.recordLogout(..., $VALUE, ...)
          - pattern: $AUDIT.recordLockoutSet(..., $VALUE, ...)
          - pattern: $AUDIT.recordLockoutLiftedByExpiry(..., $VALUE, ...)
          - pattern: $AUDIT.recordLockoutLiftedByUnlock(..., $VALUE, ...)
          - pattern: $AUDIT.recordAccountDisabled(..., $VALUE, ...)
          - pattern: $AUDIT.recordAccountEnabled(..., $VALUE, ...)
          - pattern: $AUDIT.recordConnectorCreated(..., $VALUE, ...)
          - pattern: $AUDIT.recordConnectorDeleted(..., $VALUE, ...)
          - pattern: $AUDIT.recordConnectorTokenIssued(..., $VALUE, ...)
          - pattern: $AUDIT.recordConnectorTokenRotated(..., $VALUE, ...)
          - pattern: $AUDIT.recordConnectorTokenRevoked(..., $VALUE, ...)
          - pattern: new AuditEvent(..., $VALUE, ...)
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i).*(user_?name|password|passwd|credential|secret|bearer|token|hash|cookie).*
      # The audit slice's own closed sets are not values a caller supplied, and some
      # of their members read as credential words — AuditRefusalReason.BAD_CREDENTIALS
      # and AuditLoginMethod.PASSWORD most of all. Excluding references to those types
      # by name keeps the rule pointed at what it is for: an identifier or a secret
      # from outside the slice.
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!.*\b(AuditRefusalReason|AuditOperation|AuditOutcome|AuditLoginMethod)\b).*$

  - id: be-audit-retention-role-outside-its-adapter
    languages: [java]
    severity: ERROR
    message: >-
      The backend_audit_retention database role is the only role permitted to
      update or delete a recorded audit event, and AuditEventRetentionAdapter is
      the only place that may assume it. A second place that does is a second way
      for the application to mutate the trail, which is exactly what the split
      roles and the table's append-only trigger exist to prevent. If retention
      needs to do something new, it belongs behind the AuditEventRetention port.
    paths:
      exclude:
        # The adapter that owns the role, and the tests that prove the split is
        # enforced at the database — which they can only do by speaking as each
        # role in turn.
        - "**/AuditEventRetentionAdapter.java"
        - "**/AuditAppendOnlyIntegrationTests.java"
        - "**/AuditEventRecordingIntegrationTests.java"
    pattern-regex: SET\s+(LOCAL\s+)?ROLE\s+backend_audit_retention

  # ---------------------------------------------------------------------------
  # A connector token is read from the Authorization header and from nowhere else.
  #
  # Structural rather than a check, because the property is "the other locations
  # are never consulted" — which a check cannot express and a reviewer cannot
  # verify of code that does not exist yet. Each of the three banned locations
  # carries the credential somewhere it outlives the request: a query string into
  # access logs, browser history and Referer headers; a form body into any proxy
  # that records bodies; a cookie into every later same-origin request, including
  # ones some page the operator visited caused. RFC 6750 deprecates the first two
  # for those reasons and the SCIM chain accepts none of them.
  #
  # Scoped to the SCIM slice. The application chain's own adapters read parameters
  # legitimately — a login form posts one — so a service-wide ban would be wrong.
  # ---------------------------------------------------------------------------

  - id: be-scim-credential-read-outside-the-authorization-header
    languages: [java]
    severity: ERROR
    message: >-
      A SCIM request's parameters or cookies are being read. The connector token is
      accepted from `Authorization: Bearer` and nowhere else, and that holds because
      nothing in this slice looks anywhere else — not because a check rejects the
      other locations. Read the header through
      request.getHeader(HttpHeaders.AUTHORIZATION). If a future SCIM endpoint needs a
      genuine query PARAMETER (a filter, a sort, a page), take it through the Spring
      MVC binding on the handler rather than reaching into the servlet request here.
    paths:
      include:
        - "**/scim/**"
      exclude:
        # The tests that prove the property, which can only do so by PRESENTING a
        # token in each banned location and watching the request arrive
        # unauthenticated.
        - "**/ScimBearerAuthenticationFilterTests.java"
        - "**/ScimConnectorLifecycleIntegrationTests.java"
    pattern-either:
      - pattern: $REQUEST.getParameter(...)
      - pattern: $REQUEST.getParameterMap(...)
      - pattern: $REQUEST.getParameterValues(...)
      - pattern: $REQUEST.getCookies(...)
      - pattern: $REQUEST.getQueryString(...)
