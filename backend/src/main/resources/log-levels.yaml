# Logger levels that the redaction rule depends on — no submitted value, and no
# connection detail (JDBC URL, database host, database name), in any line — in
# their own document so
# both the main and the test resources' `application.yaml` import it. The test
# `application.yaml` shadows the main one entirely, and it deliberately does not
# import `logging.yaml` (tests log in the pattern layout), so a level stated in
# either of those would be invisible to the tests that prove it. This file's
# name is never shadowed, which is what lets `JdbcErrorLogRedactionTests` read
# the deployed value and drive a refused write against it, and lets
# `StartupLogConnectionDetailsTests` run the migrate step and start the service
# against them. The migrate step (MigrationStep) reads the main
# `application.yaml`, so these levels hold for it as for the service.
#
# Each logger below is pinned: a level stated for the logger itself, which a
# broader setting (`logging.level.root`, or a library's package) cannot reach,
# so turning logging up to debug a problem does not turn these lines back on.
#
# See /docs/adr/0003-ecs-structured-logging-with-redaction.md.
logging:
  level:
    # Hibernate's JDBC error logger (`SQLExceptionLogging.ERROR_NAME`) writes the
    # driver's message as it stands, at WARN, for every statement the database
    # refuses. SQL Server quotes the refused value in it: a unique violation as
    # `… The duplicate key value is (<userName>).` That puts a submitted
    # userName or Group displayName in the log stream on every `409 uniqueness`,
    # and Semgrep cannot see it because the call is inside Hibernate.
    #
    # OFF rather than ERROR: the category carries nothing but the driver's text,
    # so there is no level at which it is safe. The fault stays observable through
    # the application's own structured records — `ScimExceptionHandler` for an
    # unmapped violation, the refusal audit and metrics for a conflict.
    org.hibernate.orm.jdbc.error: "OFF"
    # Spring MVC's DefaultHandlerExceptionResolver writes one unstructured WARN,
    # "Resolved [<exception>: <message>]", for every refusal the dispatcher makes
    # itself — 405, 406, 415, a missing parameter, a type mismatch. The message
    # quotes the request: the method, the Content-Type or Accept the caller sent,
    # the parameter value that failed to convert. That is caller input in the log
    # stream, outside any structured field, and in the SCIM namespace it is also a
    # second record beside the `scim.refusal` one `ScimErrorDocument` writes (#69).
    #
    # OFF for the same reason as above: the category carries nothing but that
    # text. Every such refusal still has its request record (status and route),
    # and in the SCIM namespace its `scim.refusal` record.
    org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver: "OFF"
    #
    # ---- connection details ----------------------------------------------------
    #
    # A JDBC URL names the database host, port and database; none of them may
    # reach a log line, at startup or ever (ADR 0003, "Connection details"). Each
    # library below writes the URL itself, so its logger is held below the level
    # it writes it at.
    #
    # Flyway's database-information line, at INFO on every migrate and validate:
    # "Database: <the JDBC URL> (<engine version>)". Flyway runs in the migrate
    # step, and in a local run and the test suite; never in a deployed service.
    # WARN keeps Flyway's warnings and its migration progress (which names only
    # versions and the schema) at their own loggers, and drops the one line that
    # is nothing but the URL.
    org.flywaydb.core.FlywayExecutor: "WARN"
    # Flyway's schema history lines, at INFO on a migrate: on SQL Server they name
    # the history table three-part, database first — "Schema history table
    # [<the database>].[dbo].[flyway_schema_history] does not exist yet",
    # "Creating Schema History table [<the database>]…". WARN keeps the logger's
    # warnings; migration progress stays at DbMigrate's own logger, which names
    # the schema alone.
    org.flywaydb.core.internal.schemahistory.JdbcTableSchemaHistory: "WARN"
    # Hibernate's HHH10001005 "Database info" block, at INFO once per persistence
    # unit: the JDBC URL and the default catalog — which is the database name.
    # WARN keeps the logger's pool warnings; there is nothing else at INFO.
    org.hibernate.orm.connections.pooling: "WARN"
    # Hikari, at INFO, writes its pools' lifecycle lines, naming each pool and
    # nothing about where it connects ("app - Start completed."). The service has
    # three pools, each named: `app` (the main pool), `audit-append` and
    # `retention`, the last two opening on first use. At DEBUG HikariConfig dumps
    # every pool setting as each pool opens, `jdbcUrl` included, and the pools'
    # housekeeping lines follow. INFO, so Hikari logs pool names only, for all
    # three. (The migrate step opens no pool.)
    com.zaxxer.hikari: "INFO"
    # The Microsoft SQL Server driver logs through java.util.logging, which Boot
    # bridges in. At FINE and below it traces every connection it opens — the
    # server name, port and database it dials — and the statements it sends, and
    # SQL Server quotes the refused value in a unique-violation message as
    # PostgreSQL did (ADR 0015, lm-19). WARN keeps what it warns of.
    com.microsoft.sqlserver.jdbc: "WARN"
