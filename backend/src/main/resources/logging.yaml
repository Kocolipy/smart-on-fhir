# Log formatting, in its own document for the same reason `session.yaml` is: the
# test resources' `application.yaml` shadows the main one entirely, so a setting
# stated only there is a setting no test can see. This file's name is never
# shadowed, which is what lets `EcsLogFormatTests` assert the deployed value
# rather than a copy of it.
logging:
  structured:
    format:
      # ECS (Elastic Common Schema) JSON on stdout, one object per record. Not
      # cosmetic: the redaction rule this service is held to — no userName,
      # filter expression, password, bearer value, hash or cookie value in a log
      # line, in the message or in the context — is enforceable because every
      # record is structured and nothing is concatenated into a message. A
      # record's variable parts are named fields, so a value a caller influenced
      # cannot change the shape of a record or forge the next one.
      #
      # See /docs/adr/0003-ecs-structured-logging-with-redaction.md.
      #
      # Overridable so a developer can set it empty for the human-readable
      # pattern while working locally. A deployment leaves it alone: a collector
      # cannot parse the pattern layout. The redaction property does not depend
      # on the format either way — nothing anywhere is allowed to log the values
      # above, whichever layout is in force.
      console: ${LOG_STRUCTURED_FORMAT:ecs}
      # The log file, when there is one, is always ECS: it exists to be read by a
      # forwarding agent, never by a person, so it has no human-readable mode.
      file: ecs
    ecs:
      # The service fields every record carries (`service.*`). `name` is stated
      # rather than inherited from `spring.application.name`, so renaming the
      # application cannot silently rename the service a log search selects on.
      # `version` is the build's: this one document is resource-filtered
      # (`pom.xml`), so `@project.version@` is replaced with the version of the
      # artefact being built. `environment` is the deployment's to say.
      service:
        name: backend
        version: "@project.version@"
        environment: ${APP_ENVIRONMENT:local}
    json:
      # Renders `@timestamp` in Singapore time (+08:00), as the logging standard
      # requires, without moving the JVM's default zone; and moves the
      # `error_code`/`error_category`/`error_follow_up_action` keys the call sites
      # write into the `error` object, where `Log_Schema.md` §Error defines them.
      # See the classes, and ADR 0003's "Format and envelope" and "Error
      # classification".
      customizer:
        - com.example.backend.observability.EcsTimestampCustomizer
        - com.example.backend.observability.EcsErrorFieldsCustomizer
  file:
    # A durable local copy for a forwarding agent (the deployment's CloudWatch
    # agent), alongside stdout rather than instead of it. Unset — the default,
    # and what local development and the tests run with — means no file at all.
    # The service never ships a log over the network itself.
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      # Size AND time: Boot's default file-name pattern
      # (`${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz`) rolls the file daily or at 50 MB,
      # whichever comes first; rolled files are kept 14 days, and the whole set
      # never exceeds 1 GB, so a burst cannot fill the disk the service runs on.
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
