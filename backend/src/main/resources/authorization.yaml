# The development fixtures: the Users and Groups a local run and the e2e suite
# sign in as, and — under the `local` profile only — what each Group confers.
#
# Imported by the main `application.yaml`. The test resources' `application.yaml`
# shadows the main one and does NOT import this file: a test that needs the
# fixtures imports this document explicitly (the `dev-fixtures` test profile).
#
# There is no role mapping. A Group's Permissions are data, stored per Group in
# the database (ADR 0015); a Group with none confers nothing, and the Admin group,
# whose direct members are the Superuser, carries none. Configuration reference:
# backend/docs/configuration/group-permissions.md.

app:
  # One Group per development access level, each with one User in it, so local
  # runs and the e2e suite have a User per Group to sign in as, plus a User in no
  # Group at all. The Superuser's User is the Bootstrap Admin, which is the only
  # User seeded regardless.
  #
  # OFF unless APP_DEV_FIXTURES_ENABLED=true (`.env.example` sets it). The
  # password has no fallback here: this remote is public, so a deployment that
  # enabled the fixtures without choosing one fails startup rather than shipping
  # a published credential.
  dev-fixtures:
    enabled: ${APP_DEV_FIXTURES_ENABLED:false}
    password: ${APP_DEV_FIXTURES_PASSWORD:}
    # A User in no Group, so it holds only the baseline Permissions: the e2e
    # suite's `user` project and the non-administrative paths sign in as it.
    baseline-member: user
    # A User in no Group whose dormancy basis is put a day past the lockout
    # window at every startup, and whose password and lock are reset with it, so
    # the startup dormancy run the fixtures enable (DevDormancyStartupConfig) locks
    # it: the e2e suite's dormancy journey signs in as it.
    dormant-member: dormant
    # Put back into these at every startup, so the startup dormancy run has
    # memberships to remove (Auditors and Monitoring, each conferring a Permission
    # under the `local` profile below).
    dormant-groups:
      - 00000000-0000-4000-8000-00000000a003
      - 00000000-0000-4000-8000-00000000a005
    groups:
      - id: 00000000-0000-4000-8000-00000000a002
        display-name: Account admins
        member: account-admin
      - id: 00000000-0000-4000-8000-00000000a003
        display-name: Auditors
        member: auditor
      - id: 00000000-0000-4000-8000-00000000a004
        display-name: Connector admins
        member: connector-admin
      - id: 00000000-0000-4000-8000-00000000a005
        display-name: Monitoring
        member: monitoring
      - id: 00000000-0000-4000-8000-00000000a006
        display-name: Helpdesk
        member: helpdesk
      # The Group the e2e suite deletes over SCIM, to watch its member's session
      # end: no other spec relies on it, and the next startup creates it again.
      - id: 00000000-0000-4000-8000-00000000a007
        display-name: Disposable auditors
        member: disposable-auditor

---
# What each development Group confers, by its stable id: the `local` profile's
# alone, so no other profile — a deployment's included — seeds a Group
# Permission. Applied at startup, after the fixture Groups exist, and only to a
# Group that carries no Permission yet, so a Group whose Permissions were set
# since keeps them. Each name must be a delegatable Permission (user:read,
# account:unlock, group:read, audit:read, ops:read, connector:read); any other
# fails startup, and so does naming the Admin group or a Group that does not
# exist. A list rather than a map, so a higher-precedence source replaces it whole.
spring:
  config:
    activate:
      on-profile: local
app:
  dev-fixtures:
    group-permissions:
      - group: 00000000-0000-4000-8000-00000000a002
        # Account admins: read the Users and Groups, Unlock and force a change.
        permissions: [user:read, account:unlock, group:read]
      - group: 00000000-0000-4000-8000-00000000a003
        permissions: [audit:read]
      - group: 00000000-0000-4000-8000-00000000a004
        # Lists connectors and administers none: creating or deleting one and
        # minting or rotating a token are the Superuser's alone (ADR 0015).
        permissions: [connector:read]
      - group: 00000000-0000-4000-8000-00000000a005
        permissions: [ops:read]
      - group: 00000000-0000-4000-8000-00000000a006
        # The helpdesk power alone: see the Users and Unlock or force-change one.
        permissions: [user:read, account:unlock]
      - group: 00000000-0000-4000-8000-00000000a007
        permissions: [audit:read]
