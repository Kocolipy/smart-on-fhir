spring:
  application:
    name: backend
  config:
    # The session repository type and configure-action live in `session.yaml`,
    # the structured log format in `logging.yaml`, the logger levels the
    # redaction rule depends on in `log-levels.yaml`, and the actuator exposure
    # and metrics settings in `telemetry.yaml`, so the test resources'
    # `application.yaml` — which shadows this file entirely — can import the same
    # documents instead of restating them. The role mapping and the development
    # fixtures live in `authorization.yaml`, which the test resources do NOT
    # import: their contexts carry a Superuser-only mapping of their own.
    import: classpath:session.yaml,classpath:logging.yaml,classpath:log-levels.yaml,classpath:telemetry.yaml,classpath:authorization.yaml
  # The main pool (DataSourceConfig), as the APP LOGIN: a member of `backend_app`
  # only, with full DML on the tables the application owns the lifecycle of and
  # INSERT/SELECT only on `audit_events`. That is what makes the audit trail
  # append-only for THIS application rather than only by convention — an UPDATE or
  # DELETE from application code is refused by the server with SQLSTATE 42501,
  # whatever the code intended. Nothing runs on a new connection: the login's
  # privileges are the pool's. The audit append pool connects as the same login.
  #
  # No credential has a fallback: this repository is public, so a deployment that
  # forgot one fails to start rather than signing in with a published password.
  # `spring.datasource.hikari.*` settings still bind to this pool.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/backend}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      # Flyway migrations (src/main/resources/db/migration) are the only source
      # of schema; `validate` fails startup on drift instead of silently
      # generating DDL, which is what `update`/`create*` would do here.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Off in the service. The deployed service never holds the owner credential:
    # migrations run beforehand in the one-shot migrate step (`java -jar
    # backend.jar migrate`, the `migrate` profile below), and `ddl-auto: validate`
    # above still fails this process's start on a schema that drifted. Only the
    # `local`, `test` and `migrate` profiles turn Flyway on.
    enabled: false
    baseline-on-migrate: false
  task:
    scheduling:
      pool:
        # One thread per scheduled job — audit retention and dormancy — so a slow
        # run of one never delays the other in-process. Across instances each job
        # is serialized by its own lock row.
        size: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  session:
    # `spring.session.data.redis`, not `spring.session.redis`: Boot 4 moved these
    # keys and the old prefix is deprecated at error level, which means quietly
    # ignored — the namespace and flush mode below only take effect here.
    data:
      redis:
        namespace: backend:session
        flush-mode: on-save

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:15m}
      cookie:
        name: JSESSIONID
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  scim:
    # The release gate. Absent on purpose: the default — OPEN — belongs to
    # ScimSecurityConfig's @Value expression, so an unset setting reaches the gate
    # as open and "SCIM is on unless someone turned it off" is a fact about the
    # code rather than about this file, which a deployment may replace wholesale.
    #
    # It defaulted to CLOSED while only the User half of the model existed. Users
    # and Groups are one release capability, and the Group half now exists, so the
    # gate opened. An open gate does not mean an open service: every path in the
    # namespace, discovery included, still answers 401 without a connector token.
    #
    # Turn SCIM off with APP_SCIM_ENABLED=false; see README.md's Configuration
    # section.
  epic:
    # Epic Login. Absent on purpose, every key of it: EpicLoginProperties binds the
    # APP_EPIC_* variables by relaxed binding, and owns the only defaults there are
    # (both switches off, timeouts 2s / 5s). No URL, client id or key may ever get a
    # fallback here — this repository is public. See README.md's "Epic Login".
  auth:
    # The Bootstrap Admin, the one User every deployment is seeded with. The
    # non-administrative `user` is a development fixture (authorization.yaml).
    bootstrap-username: ${APP_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${APP_BOOTSTRAP_PASSWORD:P@ssw0rd}
    lockout:
      # Consecutive failures that lock an account. There is deliberately no
      # duration setting: a lockout is lifted by an Admin's Unlock and by nothing
      # else, so a window here would describe a lift no code performs.
      max-attempts: ${APP_LOCKOUT_MAX_ATTEMPTS:3}
  session:
    # The fixed ceiling on a session's age from creation, independent of the
    # idle timeout above (`server.servlet.session.timeout`), which resets on
    # every request and so never bounds a continuously-active session on its
    # own.
    absolute-lifetime: ${APP_SESSION_ABSOLUTE_LIFETIME:8h}
  datasource:
    # The retention pool (AuditRetentionPoolConfig), as the RETENTION LOGIN: a
    # member of `backend_audit_retention` only, which may read and delete audit
    # events and do nothing else. Used by the audit retention job alone, on the main
    # pool's database; two connections, 10 s connection timeout. No fallback.
    retention:
      username: ${DATABASE_RETENTION_USERNAME}
      password: ${DATABASE_RETENTION_PASSWORD}
  audit:
    retention:
      # `period` and `schedule` are deliberately absent, not forgotten. Both
      # defaults — one year, and 03:30 daily — belong to AuditRetentionPolicy,
      # which is also where the 90-day floor is enforced, so writing a default
      # here would be a second copy of a number the domain owns and the two would
      # drift. An unset setting has to reach the policy as unset for "the default
      # is one year" to be a fact about the rule rather than about this file.
      #
      # Override with APP_AUDIT_RETENTION_PERIOD (e.g. 400d) and
      # APP_AUDIT_RETENTION_SCHEDULE; see README.md's Configuration section for
      # the exact default and floor. A value below 90 days fails startup.
  dormancy:
    # `lockout.window` and `role.revocation.window` are deliberately absent, for
    # the reason the retention settings are: both defaults — 90 days and 180
    # days — belong to DormancyPolicy, so an unset setting reaches the rule as
    # unset. Override with APP_DORMANCY_LOCKOUT_WINDOW and
    # APP_DORMANCY_ROLE_REVOCATION_WINDOW (e.g. 60d); see README.md's
    # Configuration section. A zero or negative window, or a role revocation
    # window not longer than the lockout window, fails startup.


# The `management:` block lives in `telemetry.yaml` (imported above), which
# defines a superset of what main declared here — health, info AND the
# `prometheus` scrape, plus the histogram settings — so re-declaring a plain
# `management:` block in this file would shadow the import and silently drop
# `prometheus` from exposure. The health probe / show-details settings main
# added are identical to telemetry.yaml's, so nothing is lost by omitting them.

---
# Where migrations run: a local run, the test suite, and the one-shot migrate step
# (MigrationStep). Flyway connects as the OWNER LOGIN, on a connection of its own
# outside every pool, and learns the app and retention logins' NAMES (never their
# passwords) as placeholders: the migrations grant each its role, quoting the
# name, after MigrationLoginNames has checked it against ^[a-z][a-z0-9_]{2,30}$.
# The owner credential has no fallback and is read nowhere else. (The test
# resources' application.yaml shadows this file; ContainerTestConfiguration gives
# the test contexts the same settings.)
spring:
  config:
    activate:
      on-profile: local | test | migrate
  flyway:
    enabled: true
    user: ${DATABASE_OWNER_USERNAME}
    password: ${DATABASE_OWNER_PASSWORD}
    placeholders:
      "[app_login]": ${DATABASE_USERNAME}
      "[retention_login]": ${DATABASE_RETENTION_USERNAME}

---
# The migrate step has no pool to borrow a URL from, so Flyway is told the
# service's database directly. It reads DATABASE_URL, the owner login and the two
# other logins' names, and no password but the owner's.
spring:
  config:
    activate:
      on-profile: migrate
  flyway:
    url: ${spring.datasource.url}
