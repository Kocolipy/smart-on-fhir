# Activated by tests that exercise the shipped DEVELOPMENT fixtures rather than
# the bare directory the base test configuration starts with (the seeded Admin
# group and nothing else). Importing the shipped document (rather than copying
# it) is the point: the Groups and Users these tests sign in as are the ones local
# runs and the e2e suite get. Their Group Permissions are the shipped document's
# `local` profile block, so a test that needs them activates `local` beside this
# profile; that block is the only part of the test configuration `local` reaches,
# because the test `application.yaml` shadows the main one. The fixtures'
# `enabled` and `password` are set by the test itself, because the imported
# document's own values take precedence over this file's.
spring:
  config:
    import: classpath:authorization.yaml
