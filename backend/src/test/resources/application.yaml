spring:
  config:
    # This file shadows the main `application.yaml` entirely, so the session
    # repository type it needs is imported from the same document the deployed
    # service reads rather than copied here. Without it these contexts would wire
    # a session repository that cannot be searched by principal and
    # AccountSessionsAdapter would have nothing to inject. `telemetry.yaml` is
    # imported for the same reason: the scrape a test reads must be exposed and
    # bucketed exactly as the deployed one is. `log-levels.yaml` likewise: a
    # refused write must be logged at the deployed levels, or a test asserting
    # that no submitted value reaches the log would be testing a different
    # logger configuration from the one that ships. `logging.yaml` likewise: the
    # service fields, the timestamp zone and the log-file settings a record is
    # written with are the deployed ones, and with LOG_FILE unset — as it is
    # here — there is no file.
    # `database.yaml` likewise: every test pool is opened with the deployed
    # driver properties (encrypted, TLS 1.2, the login timeout).
    import: classpath:session.yaml,classpath:logging.yaml,classpath:log-levels.yaml,classpath:telemetry.yaml,classpath:database.yaml
  session:
    data:
      redis:
        # The one departure from `session.yaml`: no expired-session cleanup job. The repository
        # runs it on a scheduler of its own, which the test framework does not pause with a cached
        # context while it does stop the context's Redis connection factory, so every paused
        # context logged an ERROR at the top of each minute. Those landed in whichever test was
        # capturing WARN and ERROR records then. No test exercises the cleanup.
        cleanup-cron: "-"
  # No spring.datasource.* here: ContainerTestConfiguration's SQL Server
  # container registers the URL, the logins and Flyway's owner login onto each
  # context directly, and the migrations are T-SQL that only a real SQL Server —
  # not an in-memory substitute — can run as the deployed service does.
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      # Inert unless a test arms it; see the class. Named here, for every context, so the tests
      # that interleave a commit into a read join the shared context instead of booting their own.
      hibernate.session_factory.statement_inspector: com.example.backend.scim.infrastructure.persistence.CommitBetweenStatements
      # The main `application.yaml`'s pin, repeated because this file shadows it: the tests write
      # and read timestamps at UTC as the deployed service does (ADR 0013, "Storage is UTC only").
      hibernate.jdbc.time_zone: UTC

app:
  auth:
    bootstrap-username: test-admin
    bootstrap-password: test-admin-password
    lockout:
      max-attempts: 3
  session:
    absolute-lifetime: 8h
  # Not `authorization.yaml`'s development mapping: the minimum a valid mapping
  # is, so no test context needs Groups beyond the seeded Admin group to start.
  # A test exercising the development mapping and its fixtures imports
  # `classpath:authorization.yaml` itself.
  authorization:
    roles:
      - name: Superuser
        permissions:
          - user:read
          - user:write
          - group:read
          - group:write
          - audit:read
          - connector:read
          - connector:write
          - connector:token
          - ops:read
          - patient:read
    groups:
      - id: 00000000-0000-4000-8000-00000000a001
        role: Superuser
        superuser: true
