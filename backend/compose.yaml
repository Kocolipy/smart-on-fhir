# Exact patch + digest on every dependency image. These back the tests — Playwright
# runs against a real SQL Server and a real Redis — so a floating tag means a green
# run today and an unexplained red one after an upstream rebuild. Refresh tag and
# digest together (see /README.md, "Toolchain pins").
#
# SQL Server reads its sa password, and the init the three logins, from
# backend/.env, which compose reads for interpolation (copy .env.example). x86_64
# only: the image has no arm64 build, and Apple Silicon runs it only through slow,
# unsupported emulation (backend/README.md).

# The local Epic stand-in's shared settings (the `fhircast` profile below).
# Development fixtures for services published on 127.0.0.1 alone, and nothing
# that opens anything else: the super admin is Medplum's own published default.
x-fhircast-medplum-super-admin:
  email: &medplum-admin-email admin@example.com
  password: &medplum-admin-password medplum_admin

services:
  sqlserver:
    # SQL Server 2022 CU27, Developer Edition (free for development and test use).
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      # SQL Server takes what memory it can see unless told otherwise; this caps
      # its own use below the container's limit.
      MSSQL_MEMORY_LIMIT_MB: "2048"
      # This server keeps its default collation (the deployed RDS server is
      # Latin1_General_100_BIN2_UTF8; infra/docs/database-engine.md). The database is created with
      # Latin1_General_100_BIN2_UTF8 by the init below (ADR 0013); a server collated
      # BIN2_UTF8 cannot load the internal procedures behind sp_getapplock, which
      # Flyway takes to guard every migration (the seed lock is a row lock).
    mem_limit: 3g
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # The password reaches sqlcmd through its environment, not its arguments.
      test:
        [
          "CMD-SHELL",
          'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q ''SELECT 1'' -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # One-shot and idempotent: once SQL Server is healthy, creates the database with
  # its creation options (collation, compatibility level 160, read-committed
  # snapshot, snapshot isolation) and the owner, app and retention logins from
  # backend/.env, then exits non-zero on any failure. Echoes no secret
  # (scripts/local-db-init.sh). Run in the foreground, so its exit status is the
  # caller's: `make infra-up` runs it after `up --wait` (which does not wait for a
  # one-shot to finish) with `docker compose run --rm sqlserver-init`, every time,
  # which applies a changed .env. Its own profile keeps it out of a plain `up`.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    platform: linux/amd64
    profiles: ["init"]
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      # The database DATABASE_URL in .env.example names.
      DATABASE_NAME: backend
      DATABASE_OWNER_USERNAME: ${DATABASE_OWNER_USERNAME:-}
      DATABASE_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:-}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_RETENTION_USERNAME: ${DATABASE_RETENTION_USERNAME:-}
      DATABASE_RETENTION_PASSWORD: ${DATABASE_RETENTION_PASSWORD:-}
    volumes:
      - ./scripts/local-db-init.sh:/init/local-db-init.sh:ro
      - ./scripts/local-db-init.sql:/init/local-db-init.sql:ro
    entrypoint: ["/bin/bash", "/init/local-db-init.sh"]
    restart: "no"

  redis:
    image: redis:8.2.10-alpine@sha256:8d02c1dc547ea659066d2ca18fce4e80f0a84cfe56a61af2ced2c2a48de3597c
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- The local Epic stand-in (`fhircast` profile) --------------------------
  #
  # The one local stand-in for Epic, for a real SMART EHR launch with no Epic
  # sandbox (/docs/adr/0012-epic-login.md), and for Epic's local FHIRcast hub,
  # which runs on the clinician's own machine, so its `hub.url` is a loopback
  # address. Self-hosted Medplum is both the SMART EHR launcher and the FHIRcast
  # STU3 websocket hub; the DCR shim in ./fhircast-shim plays the hub's
  # authorization role, which Medplum lacks.
  # The shim also fronts Medplum: Medplum names its `hub.url` from its own base
  # URL, and the shim must answer the `.well-known` metadata under it, so that
  # base URL — http://127.0.0.1:8103/ — is the shim's port, and the shim passes
  # everything else through. Opt-in: the `fhircast` profile keeps it out of a
  # plain `up`, so `make infra-up` still starts only SQL Server and Redis; start
  # it with `make fhircast-up`. docs/configuration/epic-login.md, "Local Epic
  # stand-in", has the ports and the APP_EPIC_* values that point the backend
  # at it.
  medplum-postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    profiles: ["fhircast"]
    # Reached by Medplum alone, on the compose network: no port is published.
    environment:
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: medplum
      POSTGRES_DB: medplum
    volumes:
      - medplum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "medplum", "-d", "medplum"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  medplum-redis:
    image: redis:8.2.10-alpine@sha256:8d02c1dc547ea659066d2ca18fce4e80f0a84cfe56a61af2ced2c2a48de3597c
    profiles: ["fhircast"]
    # Medplum's own, apart from the app's sessions: no port is published.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  medplum:
    image: medplum/medplum-server:5.2.7@sha256:afe9806b4cb36a0ef84b6fad8bc3fab01e783a2faa2ac988231fbe9f7ce28b03
    profiles: ["fhircast"]
    depends_on:
      medplum-postgres:
        condition: service_healthy
      medplum-redis:
        condition: service_healthy
    # The image's entrypoint is the server; `env` makes it read the settings
    # below rather than a config file the image does not ship.
    command: ["env"]
    environment:
      MEDPLUM_PORT: "8103"
      # The shim's address: the shim fronts Medplum (see above).
      MEDPLUM_BASE_URL: http://127.0.0.1:8103/
      # Without the trailing slash: the backend discovers the issuer at
      # {issuer}/.well-known/openid-configuration and holds the document's
      # `issuer` and the id_token's `iss` to exactly this.
      MEDPLUM_ISSUER: http://127.0.0.1:8103
      MEDPLUM_APP_BASE_URL: http://127.0.0.1:3103/
      MEDPLUM_BINARY_STORAGE: file:./binary/
      MEDPLUM_DATABASE_HOST: medplum-postgres
      MEDPLUM_DATABASE_PORT: "5432"
      MEDPLUM_DATABASE_DBNAME: medplum
      MEDPLUM_DATABASE_USERNAME: medplum
      MEDPLUM_DATABASE_PASSWORD: medplum
      MEDPLUM_REDIS_HOST: medplum-redis
      MEDPLUM_REDIS_PORT: "6379"
      MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL: *medplum-admin-email
      MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD: *medplum-admin-password
      # Any origin: the SPA calls the hub from its own origin, whichever port
      # the backend serves it on.
      MEDPLUM_ALLOWED_ORIGINS: "*"
      # Medplum fetches our JWKS over http from the host's private address.
      MEDPLUM_ALLOW_UNSAFE_OUTBOUND: "true"
      MEDPLUM_EMAIL_PROVIDER: none
      MEDPLUM_REGISTER_ENABLED: "false"
      MEDPLUM_RATE_LIMITS_ENABLED: "false"
      MEDPLUM_LOG_LEVEL: warn
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8103/healthcheck').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      # The first start on an empty volume runs Medplum's migrations and its
      # own seed before it serves: about three minutes.
      start_period: 300s
    restart: unless-stopped

  # Medplum's web app: the sign-in page Medplum's authorize sends the browser
  # to (MEDPLUM_APP_BASE_URL above).
  medplum-app:
    image: medplum/medplum-app:5.2.7@sha256:894c5a99eed5f7cf089b67f926547241ccf3363859b0d5481894c5c38e2e524a
    profiles: ["fhircast"]
    environment:
      MEDPLUM_BASE_URL: http://127.0.0.1:8103/
      MEDPLUM_REGISTER_ENABLED: "false"
      RECAPTCHA_SITE_KEY: ""
    ports:
      - "127.0.0.1:3103:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fhircast-shim:
    image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    profiles: ["fhircast"]
    depends_on:
      medplum:
        condition: service_healthy
    volumes:
      - ./fhircast-shim:/shim:ro
    command: ["node", "/shim/src/main.mjs"]
    environment:
      SHIM_PORT: "8103"
      SHIM_PUBLIC_BASE_URL: http://127.0.0.1:8103/
      SHIM_MEDPLUM_URL: http://medplum:8103/
      SHIM_MEDPLUM_ADMIN_EMAIL: *medplum-admin-email
      SHIM_MEDPLUM_ADMIN_PASSWORD: *medplum-admin-password
      # An hour, as Epic's hub tokens last; `make integration-test` sets 75.
      SHIM_TOKEN_LIFETIME_SECONDS: ${FHIRCAST_HUB_TOKEN_LIFETIME_SECONDS:-3600}
      # A subscription's lease, which the shim holds the hub's sockets to: an
      # hour, as Medplum grants; `make integration-test` sets 75.
      SHIM_LEASE_SECONDS: ${FHIRCAST_LEASE_SECONDS:-3600}
      # GET /dcr/test/state: registrations, revoked and expired tokens, and
      # ended leases, for E2E assertions; POST /dcr/test/drop: a channel endpoint's sockets closed,
      # for E2E's dropped-socket case.
      SHIM_TEST_STATE: enabled
    ports:
      - "127.0.0.1:8103:8103"
    healthcheck:
      # Through the shim to Medplum: healthy only when both answer.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8103/fhircast/STU3/.well-known/fhircast-configuration').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot and idempotent, like sqlserver-init: seeds Medplum for this app
  # (./fhircast-shim/src/seed.mjs has what and why), printing the ids a caller
  # needs. Run in the foreground after `up --wait`, every time:
  # scripts/lib.sh's fhircast_seed does, restarting Medplum when the seed says
  # its signing key changed. Its own profile keeps it out of a plain `up`.
  medplum-init:
    image: node:22.23.3-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    profiles: ["init"]
    depends_on:
      medplum:
        condition: service_healthy
    volumes:
      - ./fhircast-shim:/shim:ro
    command: ["node", "/shim/src/seed.mjs"]
    environment:
      SEED_MEDPLUM_URL: http://medplum:8103/
      SEED_MEDPLUM_ADMIN_EMAIL: *medplum-admin-email
      SEED_MEDPLUM_ADMIN_PASSWORD: *medplum-admin-password
      SEED_PROJECT_NAME: smart-on-fhir local EHR
      # The clinician's Practitioner id, which `make fhircast-up` prints: a UUID,
      # the only id Medplum takes from a client, so it is the same everywhere.
      SEED_CLINICIAN_ID: af74a102-ebaf-46ef-b445-4f72157c473f
      SEED_CLINICIAN_EMAIL: clinician@example.com
      SEED_CLINICIAN_PASSWORD: fhircast-stand-in-clinician
      SEED_CLINICIAN_FIRST_NAME: Local
      SEED_CLINICIAN_LAST_NAME: Clinician
      # One clinician per Epic Login, FHIRcast card or FHIRcast logout E2E case
      # that signs in at Medplum, as email=Practitioner id, with the password
      # above. The ids are UUIDs, the only ids Medplum takes from a client;
      # `make integration-test` hands this list to
      # frontend/test/e2e/epic-launch.spec.ts, fhircast-card.spec.ts and
      # fhircast-logout.spec.ts as E2E_EPIC_CLINICIANS.
      SEED_EPIC_LOGIN_CLINICIANS: epic-helpdesk@example.com=5d5b1795-6573-4d8f-be48-800ce6154bc4,epic-flagged@example.com=6adfd95f-f494-466d-97f8-895e3183d8fe,epic-no-patient@example.com=4f7fb5fd-7b93-4cb3-9719-1a1aa4edee05,epic-unprovisioned@example.com=9359400f-b33d-4d34-93b9-49d588fb7857,fhircast-card@example.com=deb22ada-0dc3-4290-9974-db41652d266f,fhircast-events@example.com=68107579-b306-40f5-b730-660c27a1f979,fhircast-renewal@example.com=45888464-41bf-4f95-baa2-de6e21cd34b0,fhircast-reconnect@example.com=ce6f554e-68a9-4435-b1ac-808a5733a783,fhircast-logout-unsubscribe@example.com=c6e838d2-45b3-48c0-bff2-a08641fe9aa0,fhircast-logout-revoke@example.com=66021041-71f1-49af-9bd1-8325332dde09,fhircast-logout-token@example.com=87280cd6-1374-4cb0-8716-324e710146d9
      # Tan Wei Ming, one of the backend dev profile's patient fixtures
      # (DevPatientFixtures), by his Epic id.
      SEED_PATIENT_EPIC_ID: eq081-VQEgP8drUUqCWzHfw3
      SEED_PATIENT_FAMILY: Tan
      SEED_PATIENT_GIVEN: Wei Ming
      SEED_CLIENT_NAME: smart-on-fhir
      # Our JWKS as Medplum's container reaches the backend on the host, and
      # where the backend's callback and launch are: `make dev`'s by default,
      # the E2E's own when `make integration-test` sets them.
      SEED_CLIENT_JWKS_URI: ${FHIRCAST_BACKEND_JWKS_URI:-http://host.docker.internal:8080/api/auth/epic/jwks.json}
      SEED_CLIENT_REDIRECT_URIS: ${FHIRCAST_APP_REDIRECT_URIS:-http://localhost:5173/api/auth/epic/callback}
      SEED_CLIENT_LAUNCH_URI: ${FHIRCAST_APP_LAUNCH_URI:-http://localhost:5173/api/auth/epic/launch}
    restart: "no"

volumes:
  sqlserver-data:
  redis-data:
  medplum-postgres-data:
